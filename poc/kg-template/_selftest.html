<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <title>自测</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="shell/shell.css">
    <link rel="stylesheet" href="views/stage/stage.css">
    <link rel="stylesheet" href="views/graph/graph.css">
    <link rel="stylesheet" href="views/tree/tree.css">
    <link rel="stylesheet" href="core/transition.css">
  </head>
  <body>
    <div id="screen">
      <header id="topbar" class="topbar"></header>
      <main id="views">
        <section class="view" id="view-stage"></section>
        <section class="view" id="view-graph"></section>
        <section class="view" id="view-tree"></section>
      </main>
      <div id="overlays"></div>
      <div id="trLayer" class="tr-layer" aria-hidden="true"></div>
    </div>

    <script src="vendor/three.min.js"></script>
    <script src="data/kg-config.js"></script>
    <script src="data/kg-data.js"></script>
    <script src="data/kg-derive.js"></script>
    <script src="core/dom.js"></script>
    <script src="core/bus.js"></script>
    <script src="core/views.js"></script>
    <script src="core/router.js"></script>
    <script src="core/transition.js"></script>
    <script src="views/stage/stage.js"></script>
    <script src="views/graph/graph.js"></script>
    <script src="views/tree/tree.js"></script>
    <script src="shell/shell.js"></script>
    <script src="app.js"></script>

    <script>
    (function () {
      var R = [];
      var lastNote = null;
      function ok(name, cond, extra) {
        R.push((cond ? 'PASS' : 'FAIL') + ' | ' + name + (extra !== undefined ? '  -> ' + extra : ''));
      }
      function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
      function open(id, view) {
        var from = KG.views.locate(view, id);
        lastNote = null;
        KG.bus.emit('node:open', { id: id, view: view, from: from });
        return wait(800);
      }
      function dump() {
        var pre = document.createElement('pre');
        pre.id = 'selftest';
        pre.textContent = R.join('\n');
        document.body.appendChild(pre);
        document.title = 'SELFTEST-DONE';
      }

      window.addEventListener('error', function (e) { R.push('FAIL | 运行时异常  -> ' + e.message); });

      setTimeout(function () {
        KG.bus.on('view:changed', function (p) { if (p.note) lastNote = p.note; });

        var D = KG.derive;

        Promise.resolve()
          .then(function () {
            ok('数据体检通过', D.validate().ok);
            ok('三视图均已注册', KG.views.has('stage') && KG.views.has('graph') && KG.views.has('tree'));
            ok('首屏落在展台', KG.views.current() === 'stage', KG.views.current());
            ok('画面里不再有左侧栏', !document.querySelector('#rail'));
            ok('顶栏 3 个视图按钮', document.querySelectorAll('#topbar .kg-viewbtn').length === 3,
               document.querySelectorAll('#topbar .kg-viewbtn').length);

            var sum = D.stageCards().reduce(function (s, c) { return s + c.sample; }, 0);
            ok('展台样本数合计 == 树叶子总数', sum === D.stats().sampleTotal, sum + ' / ' + D.stats().sampleTotal);

            var loc = KG.views.locate('stage', 'c_cas');
            ok('展台能投影出立牌屏幕坐标', !!loc, loc ? Math.round(loc.x) + ',' + Math.round(loc.y) + ' ' + Math.round(loc.w) + 'x' + Math.round(loc.h) : 'null');
            return open('c_cas', 'stage');
          })
          .then(function () {
            ok('展台点类目立牌 -> 主题树', KG.views.current() === 'tree', KG.views.current());
            ok('树接住了该类目焦点', KG.ctx.focusId === 'c_cas', KG.ctx.focusId);

            KG.views.impl().focus('d_case_bank');
            return wait(420);
          })
          .then(function () {
            var l = KG.views.locate('tree', 'd_case_bank');
            ok('树能定位到 4 层深的文档', !!l, l ? Math.round(l.x) + ',' + Math.round(l.y) : 'null');
            return open('d_case_bank', 'tree');
          })
          .then(function () {
            ok('树点代表文档 -> 图谱直接命中', KG.views.current() === 'graph' && KG.ctx.focusId === 'd_case_bank',
               KG.views.current() + ' / ' + KG.ctx.focusId);
            ok('直接命中时不应有降级解释', lastNote === null, lastNote);
            return open('e_fin', 'graph');
          })
          .then(function () {
            ok('图谱点实体标签 -> 树降级到关联最多的类目', KG.views.current() === 'tree' && KG.ctx.focusId === 'c_cas',
               KG.views.current() + ' / ' + KG.ctx.focusId);
            ok('实体降级给出了解释', !!lastNote, lastNote);

            KG.views.impl().focus('c_doc__1__1__2');
            return wait(420);
          })
          .then(function () {
            return open('c_doc__1__1__2', 'tree');
          })
          .then(function () {
            ok('非代表文档 -> 图谱降级到所属类目', KG.views.current() === 'graph' && KG.ctx.focusId === 'c_doc',
               KG.views.current() + ' / ' + KG.ctx.focusId);
            ok('非代表文档降级给出了解释', !!lastNote, lastNote);

            var sb = document.querySelector('#topbar .kg-searchbtn');
            ok('顶栏有搜索按钮', !!sb, sb ? sb.textContent.trim() : 'null');
            if (sb) sb.click();
            ok('点搜索按钮能拉起检索浮层',
               !!document.querySelector('#overlays .kg-overlay--search.is-open'));
            document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));

            var g = D.search('金融');
            ok('全局检索「金融」跨类型命中', g.length >= 3,
               g.map(function (x) { return x.label + ':' + x.hits.length; }).join(' '));

            ok('跨视图回溯栈已积累', KG.ctx.history.length > 0, KG.ctx.history.length);
            var prev = KG.ctx.back();
            ok('回溯能取出上一处', !!prev, prev ? prev.view + '/' + prev.focusId : 'null');

            KG.bus.emit('view:reset', null);
            return wait(300);
          })
          .then(function () {
            ok('重置视野后焦点已清空', KG.ctx.focusId === null, KG.ctx.focusId);
            ok('重置后仍停在原视图', KG.views.current() === 'graph', KG.views.current());
            dump();
          })
          .catch(function (e) {
            R.push('FAIL | 测试链抛异常  -> ' + (e && e.message ? e.message : e));
            dump();
          });
      }, 900);
    })();
    </script>
  </body>
</html>

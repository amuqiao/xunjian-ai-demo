<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识中枢 · 3D 知识图谱展台（Three.js 版）</title>
<style>
  :root{
    --void:#05060F;
    --deep:#0A0E1F;
    --blue:#4C7DFF;
    --violet:#A855F7;
    --cyan:#22D3EE;
    --ice:#E8EDFF;
    --dim:#6F7DAE;
    --hair:rgba(120,150,255,.16);
    --sans:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    --mono:"SF Mono","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--void)}
  body{font-family:var(--sans);color:var(--ice);-webkit-font-smoothing:antialiased}

  #stage{position:fixed;inset:0}
  canvas{display:block}

  /* 环境层：底噪、渐晕，压住画面四角，让中心更聚焦 */
  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    background:
      radial-gradient(120% 90% at 50% 42%, transparent 42%, rgba(5,6,15,.55) 78%, rgba(5,6,15,.92) 100%),
      linear-gradient(180deg, rgba(76,125,255,.06) 0%, transparent 30%);
  }
  .scanlines{
    position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.35;
    background:repeating-linear-gradient(180deg, rgba(140,170,255,.045) 0 1px, transparent 1px 3px);
    mix-blend-mode:screen;
  }

  /* ── HUD ───────────────────────────────────────── */
  .hud{position:fixed;inset:0;z-index:5;pointer-events:none}

  .brand{position:absolute;top:38px;left:46px}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.42em;text-transform:uppercase;
    color:var(--dim);display:flex;align-items:center;gap:12px;margin-bottom:14px;
  }
  .eyebrow::before{content:"";width:26px;height:1px;background:linear-gradient(90deg,var(--cyan),transparent)}
  .brand h1{
    font-size:30px;font-weight:600;letter-spacing:.16em;
    background:linear-gradient(100deg,#fff 10%,#A9C4FF 55%,#C9A6FF 95%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .brand .sub{
    font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:rgba(160,180,230,.5);margin-top:9px;
  }

  .live{
    position:absolute;top:44px;right:46px;display:flex;align-items:center;gap:9px;
    font-family:var(--mono);font-size:11px;letter-spacing:.26em;color:rgba(160,180,230,.62);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:blip 2.4s ease-in-out infinite}
  @keyframes blip{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

  /* 底部指标条：路演时数字比形容词管用 */
  .metrics{
    position:absolute;left:46px;right:46px;bottom:34px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:28px;
    padding-top:18px;border-top:1px solid var(--hair);
  }
  .mgroup{display:flex;gap:52px}
  .metric .k{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
  .metric .v{font-family:var(--mono);font-size:25px;font-weight:500;letter-spacing:.02em;margin-top:6px;color:#DCE6FF}
  .metric .v em{font-style:normal;font-size:12px;color:var(--dim);margin-left:5px;letter-spacing:.14em}

  /* 当前被扫描光带唤醒的类目 */
  .focus{text-align:right;min-width:230px}
  .focus .k{font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
  .focus .v{font-size:19px;font-weight:500;letter-spacing:.1em;margin-top:8px;color:#fff;transition:color .3s}
  .focus .c{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:rgba(160,180,230,.45);margin-top:5px}

  .loading{
    position:fixed;inset:0;z-index:9;display:grid;place-content:center;gap:16px;justify-items:center;
    background:var(--void);transition:opacity .8s ease;
  }
  .loading.gone{opacity:0;pointer-events:none}
  .loading .ring{width:34px;height:34px;border:1px solid rgba(120,150,255,.2);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading p{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--dim)}

  @media (max-width:900px){
    .brand{top:24px;left:24px}
    .brand h1{font-size:21px}
    .live{top:28px;right:24px;font-size:10px}
    .metrics{left:24px;right:24px;bottom:22px;flex-direction:column;align-items:flex-start;gap:18px}
    .mgroup{gap:30px}
    .metric .v{font-size:19px}
    .focus{text-align:left}
  }
  @media (prefers-reduced-motion:reduce){
    .dot{animation:none}
  }
</style>
</head>
<body>

<div id="stage"></div>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="hud">
  <div class="brand">
    <div class="eyebrow">Knowledge Graph Exhibit</div>
    <h1 id="hubName">知识中枢</h1>
    <div class="sub" id="hubSub">RETRIEVAL-AUGMENTED KNOWLEDGE BASE</div>
  </div>

  <div class="live"><span class="dot"></span><span>索引同步中</span></div>

  <div class="metrics">
    <div class="mgroup">
      <div class="metric"><div class="k">知识库类目</div><div class="v" id="mCat">8<em>类</em></div></div>
      <div class="metric"><div class="k">文档总量</div><div class="v" id="mDoc">7,740<em>篇</em></div></div>
      <div class="metric"><div class="k">向量索引</div><div class="v">1.24<em>M</em></div></div>
      <div class="metric"><div class="k">平均召回</div><div class="v">94.2<em>%</em></div></div>
    </div>
    <div class="focus">
      <div class="k">Scanning</div>
      <div class="v" id="fName">产品文档</div>
      <div class="c" id="fCode">KB-DOC · 1,248 篇</div>
    </div>
  </div>
</div>

<div class="loading" id="loading"><div class="ring"></div><p>初始化展台</p></div>

<script src="../../vendor/three.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   CONFIG — 路演现场改这里就够了，不用翻下面的代码
   ══════════════════════════════════════════════════════════════ */
const CONFIG = {
  hub:  { name:"知识中枢", sub:"RETRIEVAL-AUGMENTED KNOWLEDGE BASE" },
  spinSeconds: 42,          // 转盘转一整圈的秒数（越大越慢越稳重）
  categories: [
    { name:"产品文档",   en:"PRODUCT DOCS",      code:"KB-DOC", count:"1,248", note:"今日更新", color:"#4C7DFF", icon:"doc"    },
    { name:"行业研报",   en:"INDUSTRY RESEARCH", code:"KB-RSH", count:"862",   note:"3 小时前", color:"#6B6BFF", icon:"chart"  },
    { name:"客户案例",   en:"CUSTOMER CASES",    code:"KB-CAS", count:"534",   note:"昨日更新", color:"#8B5CFF", icon:"people" },
    { name:"法规合规",   en:"COMPLIANCE",        code:"KB-REG", count:"1,076", note:"今日更新", color:"#A855F7", icon:"shield" },
    { name:"技术白皮书", en:"WHITEPAPERS",       code:"KB-WPR", count:"318",   note:"本周更新", color:"#B44FE8", icon:"stack"  },
    { name:"售前话术",   en:"SALES PLAYBOOK",    code:"KB-SLS", count:"645",   note:"今日更新", color:"#3AA0FF", icon:"chat"   },
    { name:"运维知识",   en:"OPS KNOWLEDGE",     code:"KB-OPS", count:"927",   note:"12 分钟前", color:"#22D3EE", icon:"node"   },
    { name:"会议纪要",   en:"MEETING NOTES",     code:"KB-MTG", count:"2,130", note:"实时接入", color:"#5AC8FA", icon:"cal"    }
  ]
};

/* ── 基础设置 ─────────────────────────────────── */
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const CATS = CONFIG.categories;
const N = CATS.length;
const R_CARD = 5.40;               // 卡片所在圆周半径（4.35→5.40，遮挡的最便宜解法）
const R_DISC = 6.70;               // 圆台半径
const DRUM_H = 2.00;               // 圆台高度（0.85→2.00，侧壁面积翻倍，转动更可读）
const CAM_DIST = 16;               // 相机距离
const CARD_LIFT = 0.62;            // 卡片离台面的悬浮高度
const CARD_TILT = -24 * Math.PI/180;  // 卡片后仰角
const hex = h => new THREE.Color(h);

document.getElementById('hubName').textContent = CONFIG.hub.name;
document.getElementById('hubSub').textContent  = CONFIG.hub.sub;
document.getElementById('mCat').innerHTML = N + '<em>类</em>';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060F, 0.036);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 120);
let ELEV = 30;                     // 俯角，方向键可调
const LOOK = new THREE.Vector3(0, 1.05, 0);
function placeCamera(){
  const e = ELEV * Math.PI/180;
  camera.position.set(0, CAM_DIST*Math.sin(e), CAM_DIST*Math.cos(e));
  camera.lookAt(LOOK);
}
placeCamera();

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x05060F, 1);
document.getElementById('stage').appendChild(renderer.domElement);

/* ── 画布纹理工具 ─────────────────────────────── */
function cv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function tex(c){ const t=new THREE.CanvasTexture(c); t.anisotropy=8; t.needsUpdate=true; return t; }
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

/* 径向渐变贴图：用于光池、粒子、底部泛光 */
function radialTex(inner, outer, stops){
  const c = cv(256,256), g = c.getContext('2d');
  const grd = g.createRadialGradient(128,128,0,128,128,128);
  (stops || [[0,'rgba(255,255,255,1)'],[0.35,'rgba(255,255,255,.42)'],[1,'rgba(255,255,255,0)']])
    .forEach(s => grd.addColorStop(s[0], s[1]));
  g.fillStyle = grd; g.fillRect(0,0,256,256);
  return tex(c);
}
const TEX_GLOW = radialTex();
const TEX_DOT  = radialTex(0,0,[[0,'rgba(255,255,255,1)'],[0.5,'rgba(255,255,255,.35)'],[1,'rgba(255,255,255,0)']]);

/* ══════════════════════════════════════════════
   转盘 —— 唯一在动的东西
   ══════════════════════════════════════════════ */
const turntable = new THREE.Group();
scene.add(turntable);

/* 桌面：深色玻璃盘，中心略亮，边缘收暗 */
{
  const c = cv(1024,1024), g = c.getContext('2d');
  const grd = g.createRadialGradient(512,512,40,512,512,512);
  grd.addColorStop(0,   'rgba(28,42,92,1)');
  grd.addColorStop(.42, 'rgba(15,22,54,1)');
  grd.addColorStop(.86, 'rgba(9,13,34,1)');
  grd.addColorStop(1,   'rgba(6,9,24,1)');
  g.fillStyle = grd; g.fillRect(0,0,1024,1024);

  // 同心刻度环
  g.strokeStyle = 'rgba(120,160,255,.10)';
  for(let i=1;i<=9;i++){ g.lineWidth = i%3===0?1.6:0.8; g.beginPath(); g.arc(512,512,i*51,0,Math.PI*2); g.stroke(); }
  // 径向分度线
  for(let i=0;i<96;i++){
    const a=i/96*Math.PI*2, long=i%8===0;
    g.strokeStyle=`rgba(140,180,255,${long?.30:.10})`; g.lineWidth=long?1.8:1;
    g.beginPath();
    g.moveTo(512+Math.cos(a)*(long?405:452), 512+Math.sin(a)*(long?405:452));
    g.lineTo(512+Math.cos(a)*500, 512+Math.sin(a)*500);
    g.stroke();
  }
  // 非对称弧段：同心圆本身是旋转对称的，转与不转看不出差别，靠这几段弧点破
  [[190,'rgba(120,200,255,.75)',0.2,1.5],[268,'rgba(170,140,255,.6)',2.6,1.1],[372,'rgba(90,170,255,.5)',4.4,2.0]]
    .forEach(([rad,col,a0,span])=>{
      g.strokeStyle=col; g.lineWidth=3.2; g.lineCap='round';
      g.shadowColor=col; g.shadowBlur=14;
      g.beginPath(); g.arc(512,512,rad,a0,a0+span); g.stroke();
      g.shadowBlur=0;
    });
  // 两颗环绕光点
  [[308,1.15,'rgba(34,211,238,1)'],[228,3.7,'rgba(168,85,247,1)']].forEach(([rad,a,col])=>{
    g.fillStyle=col; g.shadowColor=col; g.shadowBlur=20;
    g.beginPath(); g.arc(512+Math.cos(a)*rad, 512+Math.sin(a)*rad, 6, 0, 7); g.fill();
    g.shadowBlur=0;
  });

  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(R_DISC, 128),
    new THREE.MeshBasicMaterial({ map:tex(c) })
  );
  disc.rotation.x = -Math.PI/2;
  turntable.add(disc);
}

/* 桌沿：加厚的侧壁 + 竖向凹槽 + 一圈亮边
   立体感几乎全靠这段：有厚度、有明暗过渡、纹路随转动横向流走 */
{
  const W = 1024, H = 256, c = cv(W,H), g = c.getContext('2d');
  // 上亮下暗，模拟侧壁受光
  const grd = g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,   '#243662');
  grd.addColorStop(.18, '#182549');
  grd.addColorStop(.72, '#0B1130');
  grd.addColorStop(1,   '#060917');
  g.fillStyle=grd; g.fillRect(0,0,W,H);
  // 竖向凹槽
  const FLUTES = 96;
  for(let i=0;i<FLUTES;i++){
    const x = i*(W/FLUTES);
    g.fillStyle='rgba(150,190,255,.16)'; g.fillRect(x, 0, 2.4, H);
    g.fillStyle='rgba(0,0,0,.30)';       g.fillRect(x+2.4, 0, 3.2, H);
  }
  // 顶部一道亮线，把桌面和侧壁分开
  g.fillStyle='rgba(150,200,255,.55)'; g.fillRect(0,0,W,4);
  const sideTex = tex(c);
  sideTex.wrapS = THREE.RepeatWrapping;

  const side = new THREE.Mesh(
    new THREE.CylinderGeometry(R_DISC, R_DISC*0.93, DRUM_H, 160, 1, true),
    new THREE.MeshBasicMaterial({ map:sideTex, side:THREE.DoubleSide })
  );
  side.position.y = -DRUM_H/2;
  turntable.add(side);

  // 底盖，避免从低角度看穿
  const cap = new THREE.Mesh(
    new THREE.CircleGeometry(R_DISC*0.93, 96),
    new THREE.MeshBasicMaterial({ color:0x05070F, side:THREE.DoubleSide })
  );
  cap.rotation.x = Math.PI/2; cap.position.y = -DRUM_H;
  turntable.add(cap);

  // 底沿暗边
  const btm = new THREE.Mesh(
    new THREE.RingGeometry(R_DISC*0.93-0.04, R_DISC*0.93+0.01, 128),
    new THREE.MeshBasicMaterial({ color:0x3A6BC0, transparent:true, opacity:.35, blending:THREE.AdditiveBlending, side:THREE.DoubleSide })
  );
  btm.rotation.x = -Math.PI/2; btm.position.y = -DRUM_H+0.005;
  turntable.add(btm);

  /* 静止基座：压在转动鼓身之下。两者之间那道不动的接缝，
     是"它在转"最硬的证据——比任何光效都可靠 */
  const plinth = new THREE.Mesh(
    new THREE.CylinderGeometry(R_DISC*0.99, R_DISC*1.06, 0.40, 96),
    new THREE.MeshLambertMaterial({ color:0x131C3C, emissive:0x060A1A })
  );
  plinth.position.y = -DRUM_H - 0.20;
  scene.add(plinth);                       // 加进 scene 而非 turntable：它不转

  const seam = new THREE.Mesh(
    new THREE.RingGeometry(R_DISC*0.99, R_DISC*1.07, 128),
    new THREE.MeshBasicMaterial({ color:0x5E8CFF, transparent:true, opacity:.5, blending:THREE.AdditiveBlending, side:THREE.DoubleSide })
  );
  seam.rotation.x = -Math.PI/2; seam.position.y = -DRUM_H + 0.002;
  scene.add(seam);

  const rim = new THREE.Mesh(
    new THREE.RingGeometry(R_DISC-0.035, R_DISC+0.02, 160),
    new THREE.MeshBasicMaterial({ color:0x66A8FF, transparent:true, opacity:.85, blending:THREE.AdditiveBlending, side:THREE.DoubleSide })
  );
  rim.rotation.x = -Math.PI/2; rim.position.y = 0.005;
  turntable.add(rim);
}

/* 扫描光带：从圆心扫出的一道扇形拖尾 —— 展台的签名动作 */
const SWEEP_SPAN = Math.PI * 0.42;   // 拖尾张角
let sweepMesh;
{
  const S = 1024, c = cv(S,S), g = c.getContext('2d');
  g.clearRect(0,0,S,S);
  const steps = 200;
  for(let i=0;i<steps;i++){
    const t = i/steps;                       // 0 = 头部（最亮）
    const a0 = -SWEEP_SPAN*t, a1 = -SWEEP_SPAN*(t+1.4/steps);
    const alpha = Math.pow(1-t, 2.1) * 0.85;
    g.beginPath();
    g.moveTo(S/2, S/2);
    g.arc(S/2, S/2, S/2, a1, a0, false);
    g.closePath();
    const grd = g.createRadialGradient(S/2,S/2,30,S/2,S/2,S/2);
    grd.addColorStop(0,   `rgba(80,190,255,${alpha*0.15})`);
    grd.addColorStop(.55, `rgba(110,160,255,${alpha*0.62})`);
    grd.addColorStop(.93, `rgba(170,120,255,${alpha})`);
    grd.addColorStop(1,   `rgba(170,120,255,0)`);
    g.fillStyle = grd; g.fill();
  }
  sweepMesh = new THREE.Mesh(
    new THREE.CircleGeometry(R_DISC*0.985, 128),
    new THREE.MeshBasicMaterial({ map:tex(c), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:.95 })
  );
  sweepMesh.rotation.x = -Math.PI/2;
  sweepMesh.position.y = 0.012;
  turntable.add(sweepMesh);
}

/* 转盘上的浮动刻度块，给旋转一点可读的质感 */
{
  const grp = new THREE.Group();
  for(let i=0;i<44;i++){
    const a = i/44*Math.PI*2, r = R_DISC-0.55;
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(i%4===0?0.30:0.13, 0.05),
      new THREE.MeshBasicMaterial({ color:i%4===0?0x9AC4FF:0x4A6BB0, transparent:true, opacity:i%4===0?.75:.4, blending:THREE.AdditiveBlending, depthWrite:false })
    );
    m.position.set(Math.cos(a)*r, 0.03, Math.sin(a)*r);
    m.rotation.set(-Math.PI/2, 0, -a);
    grp.add(m);
  }
  turntable.add(grp);
}

/* 地面泛光：让圆桌像浮在光上 */
{
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(15, 64),
    new THREE.MeshBasicMaterial({ map:TEX_GLOW, color:0x2B4FCC, transparent:true, opacity:.30, blending:THREE.AdditiveBlending, depthWrite:false })
  );
  floor.rotation.x = -Math.PI/2; floor.position.y = -DRUM_H - 0.62;
  scene.add(floor);
}

/* ══════════════════════════════════════════════
   静态层 —— 立牌永远不转，永远正面朝人
   ══════════════════════════════════════════════ */
const statics = new THREE.Group();
scene.add(statics);

const ICONS = {
  doc:   g=>{ g.strokeRect(-16,-21,32,42); [-10,-2,6].forEach(y=>{g.beginPath();g.moveTo(-9,y);g.lineTo(9,y);g.stroke();}); },
  chart: g=>{ [[-12,8,20],[-2,-4,32],[8,2,26]].forEach(b=>{g.strokeRect(b[0]-4,20-b[2],9,b[2]);}); g.beginPath();g.moveTo(-20,22);g.lineTo(20,22);g.stroke(); },
  people:g=>{ g.beginPath();g.arc(-8,-8,7,0,7);g.stroke(); g.beginPath();g.arc(9,-4,5.5,0,7);g.stroke();
              g.beginPath();g.arc(-8,16,14,Math.PI,0);g.stroke(); g.beginPath();g.arc(9,17,10,Math.PI,0);g.stroke(); },
  shield:g=>{ g.beginPath();g.moveTo(0,-22);g.lineTo(17,-14);g.lineTo(17,4);g.quadraticCurveTo(17,18,0,23);g.quadraticCurveTo(-17,18,-17,4);g.lineTo(-17,-14);g.closePath();g.stroke();
              g.beginPath();g.moveTo(-7,0);g.lineTo(-1,7);g.lineTo(9,-6);g.stroke(); },

              [-8,0,8].forEach(x=>{g.beginPath();g.arc(x,-4,1.9,0,7);g.fill();}); },
  node:  g=>{ g.beginPath();g.arc(0,0,6,0,7);g.stroke();
              [[0,-18],[16,9],[-16,9]].forEach(p=>{g.beginPath();g.arc(p[0],p[1],4.5,0,7);g.stroke();
                g.beginPath();g.moveTo(p[0]*.32,p[1]*.32);g.lineTo(p[0]*.72,p[1]*.72);g.stroke();}); },
  cal:   g=>{ g.strokeRect(-18,-15,36,34); g.beginPath();g.moveTo(-18,-5);g.lineTo(18,-5);g.stroke();
              g.beginPath();g.moveTo(-10,-21);g.lineTo(-10,-11);g.moveTo(10,-21);g.lineTo(10,-11);g.stroke();
              [[-8,4],[2,4],[12,4],[-8,13],[2,13]].forEach(p=>g.fillRect(p[0]-2.5,p[1]-2.5,5,5)); }
};

/* 立牌贴图：512×700，含边框、图标、中文名、英文名、指标 */
function cardTexture(cat, hot){
  const W=512, H=700, c=cv(W,H), g=c.getContext('2d');
  g.clearRect(0,0,W,H);
  const pad=16, x=pad, y=pad, w=W-pad*2, h=H-pad*2, r=22;
  const col = cat.color;

  // 外发光
  g.save();
  g.shadowColor = col; g.shadowBlur = hot?58:26;
  g.fillStyle = 'rgba(10,15,38,.001)'; rr(g,x,y,w,h,r); g.fill();
  g.restore();

  // 卡面
  const bg = g.createLinearGradient(0,y,0,y+h);
  bg.addColorStop(0,   hot?'rgba(30,44,96,.97)':'rgba(18,26,62,.94)');
  bg.addColorStop(.55, hot?'rgba(16,24,60,.96)':'rgba(11,17,44,.93)');
  bg.addColorStop(1,   hot?'rgba(11,17,44,.97)':'rgba(8,12,32,.95)');
  rr(g,x,y,w,h,r); g.fillStyle=bg; g.fill();

  // 描边
  g.lineWidth = hot?3:1.6;
  g.strokeStyle = hot ? col : 'rgba(120,155,255,.30)';
  rr(g,x,y,w,h,r); g.stroke();

  // 顶部色条
  g.save(); rr(g,x,y,w,h,r); g.clip();
  const bar = g.createLinearGradient(x,0,x+w,0);
  bar.addColorStop(0,'rgba(255,255,255,0)'); bar.addColorStop(.5,col); bar.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=bar; g.fillRect(x,y,w,hot?6:4);
  // 卡面细网格
  g.strokeStyle='rgba(120,160,255,.055)'; g.lineWidth=1;
  for(let i=1;i<9;i++){ g.beginPath(); g.moveTo(x,y+i*h/9); g.lineTo(x+w,y+i*h/9); g.stroke(); }
  g.restore();

  // 代号
  g.font='500 20px "SF Mono",Menlo,monospace';
  g.fillStyle= hot? col : 'rgba(150,175,235,.55)';
  g.textAlign='left'; g.fillText(cat.code, x+30, y+52);

  // 状态点
  g.beginPath(); g.arc(x+w-34, y+45, 5, 0, 7);
  g.fillStyle = hot? col : 'rgba(140,170,230,.42)'; g.fill();

  // 图标
  g.save();
  g.translate(W/2, y+168);
  g.scale(1.65,1.65);
  g.strokeStyle = hot? '#fff' : col;
  g.fillStyle   = hot? '#fff' : col;
  g.lineWidth = 2.1; g.lineJoin='round'; g.lineCap='round';
  g.shadowColor = col; g.shadowBlur = hot?22:10;
  (ICONS[cat.icon]||ICONS.doc)(g);
  g.restore();

  // 中文名
  g.textAlign='center';
  g.font='600 52px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillStyle = hot? '#FFFFFF' : '#D6E1FF';
  if(hot){ g.shadowColor=col; g.shadowBlur=26; }
  g.fillText(cat.name, W/2, y+322);
  g.shadowBlur=0;

  // 英文名
  g.font='400 19px "SF Mono",Menlo,monospace';
  g.fillStyle='rgba(150,175,235,.62)';
  g.letterSpacing='3px';
  g.fillText(cat.en, W/2, y+360);

  // 分隔线
  const ln = g.createLinearGradient(x+60,0,x+w-60,0);
  ln.addColorStop(0,'rgba(255,255,255,0)');
  ln.addColorStop(.5, hot? col : 'rgba(120,155,255,.4)');
  ln.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=ln; g.fillRect(x+60, y+394, w-120, 1.4);

  // 指标
  g.font='500 62px "SF Mono",Menlo,monospace';
  g.fillStyle = hot? '#FFFFFF':'#C3D2FF';
  g.fillText(cat.count, W/2, y+486);
  g.font='400 21px "PingFang SC",sans-serif';
  g.fillStyle='rgba(150,175,235,.55)';
  g.fillText('篇 · '+cat.note, W/2, y+522);

  // 底部进度条：占总量的比例
  const ratio = Math.min(1, parseInt(cat.count.replace(/,/g,''))/2200);
  g.fillStyle='rgba(120,155,255,.16)'; rr(g,x+62,y+560,w-124,5,3); g.fill();
  g.fillStyle = col; rr(g,x+62,y+560,(w-124)*ratio,5,3); g.fill();

  // 底座
  g.fillStyle = hot? 'rgba(255,255,255,.12)':'rgba(120,155,255,.07)';
  rr(g, W/2-96, y+h-52, 192, 34, 8); g.fill();
  g.font='400 16px "SF Mono",Menlo,monospace';
  g.fillStyle='rgba(150,175,235,.5)';
  g.fillText('VECTOR INDEXED', W/2, y+h-30);

  return tex(c);
}

/* 生成立牌 */
const cards = [];
const CARD_W = 1.72, CARD_H = 2.35;

const CARD_T   = 0.115;      // 板材厚度
const FACE_BLEND = 0;        /* 朝向混合：0=全部正对相机。
                                曾设为 0.19 想露出侧边厚度，但卡片后仰 24° 后
                                顶面投影本就只剩 10%，歪斜换不来厚度，
                                只换来"8 张牌没对齐"。厚度改由倒角高光和悬停坐直承担。*/

/* 圆角矩形板：用 ExtrudeGeometry 挤出真实厚度和倒角。
   倒角面会单独吃光，于是卡片四周出现一圈受光的边——
   这是"看得出是块料"和"贴了张纸"的分界线。 */
function slabGeometry(w,h,t,r){
  const s = new THREE.Shape();
  const x=-w/2, y=-h/2;
  s.moveTo(x+r, y);
  s.lineTo(x+w-r, y);   s.quadraticCurveTo(x+w, y,     x+w,   y+r);
  s.lineTo(x+w,   y+h-r); s.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  s.lineTo(x+r,   y+h);   s.quadraticCurveTo(x,   y+h, x,     y+h-r);
  s.lineTo(x,     y+r);   s.quadraticCurveTo(x,   y,   x+r,   y);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: t, bevelEnabled:true, bevelThickness:0.032, bevelSize:0.032, bevelSegments:3, curveSegments:8
  });
  g.translate(0, 0, -t/2);
  return g;
}

/* ExtrudeGeometry 的 UV 直接用顶点坐标，需要换算到 0~1 才能正确贴图 */
function fitTex(tx, w, h){
  tx.repeat.set(1/w, 1/h);
  tx.offset.set(0.5, 0.5);
  tx.needsUpdate = true;
  return tx;
}

const SLAB_GEO = slabGeometry(CARD_W, CARD_H, CARD_T, 0.09);

CATS.forEach((cat,i)=>{
  const a = (i/N)*Math.PI*2 - Math.PI/2;       // 起始角
  const px = Math.cos(a)*R_CARD, pz = Math.sin(a)*R_CARD;
  const col = hex(cat.color);

  const grp = new THREE.Group();
  grp.position.set(px, 0, pz);

  const texCold = fitTex(cardTexture(cat,false), CARD_W, CARD_H);
  const texHot  = cardTexture(cat,true);

  /* 卡片正面不受光：它是一块自发光的亚克力灯牌，
     文字亮度必须恒定，不能让灯光把它压暗 */
  const matFace = new THREE.MeshBasicMaterial({ map:texCold, transparent:true, opacity:1 });
  // 侧边与倒角受光：明暗过渡全靠它
  const matEdge = new THREE.MeshLambertMaterial({ color:0x2C3D74, emissive:0x0A1230 });

  const card = new THREE.Mesh(SLAB_GEO, [matFace, matEdge]);
  card.position.y = CARD_LIFT + CARD_H/2*Math.cos(CARD_TILT);
  card.rotation.x = CARD_TILT;                  // 后仰，正对抬高后的机位
  card.userData.idx = i;                        // 供射线拾取识别
  grp.add(card);

  // 点亮层：贴在正面之上，用透明度做过渡
  const matHot = new THREE.MeshBasicMaterial({ map:texHot, transparent:true, opacity:0, depthWrite:false });
  const cardHot = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H), matHot);
  cardHot.position.set(0, card.position.y, CARD_T/2 + 0.03);
  cardHot.rotation.x = CARD_TILT;
  grp.add(cardHot);

  /* ── 光柱：卡片与圆台之间唯一的"接触" ──
     实体底座压在转动的台面上，眼睛会读成打滑；
     而一束光静止地落在旋转的面上是物理正确的，
     所以这里只用光，不用任何实体。 */
  const colTex = (()=>{
    const c = cv(8,256), g = c.getContext('2d');
    const grd = g.createLinearGradient(0,0,0,256);
    grd.addColorStop(0,   'rgba(255,255,255,0)');    // 顶端（贴卡片）淡出
    grd.addColorStop(.35, 'rgba(255,255,255,.30)');
    grd.addColorStop(1,   'rgba(255,255,255,.85)');  // 落到台面处最亮
    g.fillStyle=grd; g.fillRect(0,0,8,256);
    return tex(c);
  })();
  const column = new THREE.Mesh(
    new THREE.CylinderGeometry(0.30, 0.46, CARD_LIFT, 24, 1, true),
    new THREE.MeshBasicMaterial({ map:colTex, color:col, transparent:true, opacity:.24,
      blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide })
  );
  column.position.y = CARD_LIFT/2;
  grp.add(column);

  // 桌面倒影：平躺、镜像、压扁
  const matRef = new THREE.MeshBasicMaterial({ map:cardTexture(cat,false), transparent:true, opacity:.11, depthWrite:false });
  const ref = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H), matRef);
  ref.rotation.x = -Math.PI/2;
  ref.scale.y = -0.52;
  ref.position.set(0, 0.016, -CARD_H*0.40);
  grp.add(ref);

  // 桌面光池
  const pool = new THREE.Mesh(
    new THREE.CircleGeometry(1.05, 40),
    new THREE.MeshBasicMaterial({ map:TEX_GLOW, color:col, transparent:true, opacity:.28, blending:THREE.AdditiveBlending, depthWrite:false })
  );
  pool.rotation.x = -Math.PI/2; pool.position.set(px, 0.03, pz);
  statics.add(pool);

  statics.add(grp);
  cards.push({
    cat, grp, card, cardHot, ref, pool, column, matEdge,
    angle:a, px, pz, base:card.position.y, baseYaw:0, camYaw:0,
    phase:i*0.8, heat:0, hover:0
  });
});

/* 朝向：完全正对相机的话，8 张牌全是正脸，厚度一丝都露不出来。
   按方位角混合一点"朝外"，两侧的牌微微侧过去露出侧边，
   正前方的牌几乎不受影响，文字依然正对观众。
   俯角可调之后，这套朝向必须跟着相机重算，否则调到一半卡片会侧成纸片。 */
function orientCards(){
  cards.forEach(cd=>{
    const camYaw = Math.atan2(camera.position.x - cd.px, camera.position.z - cd.pz);
    const outYaw = Math.PI/2 - cd.angle;
    let diff = (outYaw - camYaw) % (Math.PI*2);
    if(diff >  Math.PI) diff -= Math.PI*2;
    if(diff < -Math.PI) diff += Math.PI*2;
    cd.camYaw  = camYaw;
    cd.baseYaw = camYaw + diff * FACE_BLEND;
    cd.grp.rotation.y = cd.baseYaw + (cd.camYaw - cd.baseYaw) * cd.hover;
  });
  if(coreLabel) coreLabel.lookAt(camera.position.x, coreLabel.position.y, camera.position.z);
}

let particles, pVel;

/* ══════════════════════════════════════════════
   动画：只有转盘在转，立牌被光带轮流唤醒
   ══════════════════════════════════════════════ */
const fName = document.getElementById('fName');
const fCode = document.getElementById('fCode');
let lastFocus = -1;
const SPIN = (Math.PI*2) / (CONFIG.spinSeconds * 60);   // 每帧弧度
const clock = new THREE.Clock();

/* ── 鼠标悬停拾取 ────────────────────────────── */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-2,-2);
const pickables = cards.map(cd => cd.card);
let hovered = -1, pointerMoved = false;

addEventListener('pointermove', e=>{
  pointer.x =  (e.clientX / innerWidth)  * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  pointerMoved = true;
});
addEventListener('pointerleave', ()=>{ pointer.set(-2,-2); pointerMoved = true; });

function shortestAngle(a,b){
  let d = (a-b) % (Math.PI*2);
  if(d > Math.PI) d -= Math.PI*2;
  if(d < -Math.PI) d += Math.PI*2;
  return d;
}

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // 转盘：唯一的持续运动
  if(!REDUCED) turntable.rotation.y -= SPIN;

  /* 扫描光带前缘所指的世界方位角。
     贴图绘制时前缘落在纹理 0°，CircleGeometry 绕 X 转 -90° 后世界方位角取反，
     转盘再绕 Y 转 rotation.y，于是前缘方位角 = -rotation.y。
     立牌是静止的，方位角恒为 cd.angle，两者之差就是"落后前缘多少"。*/
  const lead = -turntable.rotation.y;
  const TAU = Math.PI*2;

  // 射线拾取：鼠标移动过才重算，静止时不做无谓计算
  if(pointerMoved){
    pointerMoved = false;
    raycaster.setFromCamera(pointer, camera);
    const hit = raycaster.intersectObjects(pickables, false)[0];
    hovered = hit ? hit.object.userData.idx : -1;
    renderer.domElement.style.cursor = hovered >= 0 ? 'pointer' : 'default';
  }

  let best = -1, bestHeat = 0;
  cards.forEach((cd, i)=>{
    let d = (lead - cd.angle) % TAU;
    if(d < 0) d += TAU;
    // 前缘刚扫到时最亮，拖尾扫过逐渐熄灭
    const scan = d < SWEEP_SPAN ? Math.pow(1 - d/SWEEP_SPAN, 1.4) : 0;
    cd.hover += ((i === hovered ? 1 : 0) - cd.hover) * 0.18;
    /* 悬停接管高亮：手动选中优先于自动扫描，
       否则两套高亮会在同一张牌上打架、闪烁 */
    const heat = Math.max(scan * (1 - cd.hover), cd.hover);
    cd.heat += (heat - cd.heat) * 0.16;

    cd.cardHot.material.opacity = cd.heat;
    cd.pool.material.opacity = .22 + cd.heat*.72;
    cd.pool.scale.setScalar(1 + cd.heat*0.42);
    cd.beam.material.opacity = .30 + cd.heat*.62;
    cd.ref.material.opacity  = (.09 + cd.heat*.15) * (1 - cd.hover*.6);
    cd.column.material.opacity = .20 + cd.heat*.46;

    // 侧边提亮：受光材质，改自发光比改颜色更干净
    cd.matEdge.emissive.setRGB(.04+cd.heat*.16, .07+cd.heat*.22, .19+cd.heat*.36);

    /* 悬停效果只发生在被悬停的这一张身上，不牵动任何其他卡片。
       抬升 + 放大 + 略微坐直：坐直让后仰从 24° 收到 12°，
       顶面投影从厚度的 10% 涨到 30%，顺带把板材厚度亮出来。*/
    const float = REDUCED ? 0 : Math.sin(t*0.7 + cd.phase)*0.022;
    cd.card.position.y = cd.base + float + cd.heat*0.05 + cd.hover*0.13;
    cd.card.rotation.x = CARD_TILT * (1 - cd.hover*0.5);
    const sc = 1 + cd.hover*0.06;
    cd.card.scale.set(sc, sc, 1);
    cd.cardHot.position.y = cd.card.position.y;
    cd.cardHot.rotation.x = cd.card.rotation.x;
    cd.cardHot.scale.set(sc, sc, 1);

    if(cd.heat > bestHeat){ bestHeat = cd.heat; best = i; }
  });

  // HUD 焦点：悬停优先，鼠标移开后交还给扫描光带
  const focusIdx = hovered >= 0 ? hovered : (bestHeat > .35 ? best : -1);
  if(focusIdx >= 0 && focusIdx !== lastFocus){
    lastFocus = focusIdx;
    const c = cards[focusIdx].cat;
    fName.textContent = c.name;
    fName.style.color = c.color;
    fCode.textContent = `${c.code} · ${c.count} 篇`;
  }

  // 核心呼吸
  coreCage.rotation.y += 0.0035;
  coreCage.rotation.x += 0.0016;
  coreInner.rotation.y -= 0.006;
  const pulse = 1 + Math.sin(t*1.5)*0.06;
  coreHalo.scale.set(3.2*pulse, 3.2*pulse, 1);
  coreHalo.material.opacity = .62 + Math.sin(t*1.5)*0.13;

  // 粒子缓慢上浮
  if(!REDUCED){
    const p = particles.geometry.attributes.position;
    for(let i=0;i<p.count;i++){
      let y = p.getY(i) + pVel[i];
      if(y > 10.5) y = -1;
      p.setY(i, y);
    }
    p.needsUpdate = true;
    particles.rotation.y += 0.00035;
  }

  renderer.render(scene, camera);
}

/* ── 俯角调节：上下方向键，不在画面上留常驻控件 ──
   数字只在调节时浮出，1.5 秒后自己消失，不占路演画面 */
const readout = document.createElement('div');
readout.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:8;'+
  'font-family:var(--mono);font-size:12px;letter-spacing:.26em;color:rgba(190,210,255,.85);'+
  'background:rgba(10,16,40,.72);border:1px solid rgba(120,160,255,.28);border-radius:20px;'+
  'padding:8px 20px;opacity:0;transition:opacity .35s ease;pointer-events:none;backdrop-filter:blur(8px)';
document.body.appendChild(readout);
let readoutTimer = null;

function setElevation(v){
  ELEV = Math.max(20, Math.min(50, v));
  placeCamera();
  orientCards();                       // 关键：朝向必须跟着重算
  readout.textContent = `俯角 ${ELEV.toFixed(0)}°`;
  readout.style.opacity = '1';
  clearTimeout(readoutTimer);
  readoutTimer = setTimeout(()=>{ readout.style.opacity = '0'; }, 1500);
}
addEventListener('keydown', e=>{
  if(e.key === 'ArrowUp')        { setElevation(ELEV + 1.5); e.preventDefault(); }
  else if(e.key === 'ArrowDown') { setElevation(ELEV - 1.5); e.preventDefault(); }
});
orientCards();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
setTimeout(()=>document.getElementById('loading').classList.add('gone'), 500);
</script>
</body>
</html>

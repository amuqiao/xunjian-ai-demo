<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巡检演示大屏</title>
    <link rel="stylesheet" href="flow-nav/flow-nav.css">
    <style>
      :root {
        --demo-bg: #05060f;
        --demo-bg-scanline: rgba(140, 170, 255, 0.03);
        --demo-bg-vignette-mid: rgba(5, 6, 15, 0.42);
        --demo-bg-vignette-edge: rgba(5, 6, 15, 0.82);
        --demo-bg-top-glow: rgba(76, 125, 255, 0.08);
        --demo-bg-blue-glow: rgba(76, 125, 255, 0.16);
        --demo-bg-violet-glow: rgba(168, 85, 247, 0.10);
        --demo-screen-bg:
          repeating-linear-gradient(180deg, var(--demo-bg-scanline) 0 1px, transparent 1px 3px),
          radial-gradient(120% 90% at 50% 42%, transparent 42%, var(--demo-bg-vignette-mid) 78%, var(--demo-bg-vignette-edge) 100%),
          linear-gradient(180deg, var(--demo-bg-top-glow) 0%, transparent 32%),
          radial-gradient(1200px 700px at 20% -10%, var(--demo-bg-blue-glow), transparent 60%),
          radial-gradient(900px 600px at 110% 20%, var(--demo-bg-violet-glow), transparent 60%),
          var(--demo-bg);
        --demo-boot-bg:
          repeating-linear-gradient(180deg, var(--demo-bg-scanline) 0 1px, transparent 1px 3px),
          radial-gradient(circle at center, rgba(76, 125, 255, 0.18), rgba(5, 6, 15, 0.96) 58%),
          radial-gradient(circle at 86% 92%, var(--demo-bg-violet-glow), transparent 44%);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--demo-bg);
      }

      .demo-frame-stage {
        position: fixed;
        inset: 0;
        background: var(--demo-screen-bg);
      }

      .demo-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        background: var(--demo-bg);
      }

      .demo-frame.is-active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .demo-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: rgba(225, 245, 255, 0.86);
        font: 600 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0.12em;
        background: var(--demo-boot-bg);
        transition: opacity 0.24s ease, visibility 0.24s ease;
        pointer-events: none;
      }

      .demo-boot.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <main class="demo-frame-stage" id="frameStage" aria-label="巡检演示组件容器"></main>
    <div class="demo-boot" id="bootMask">巡检演示加载中</div>

    <script>
      (function () {
        "use strict";

        var steps = [
          { key: "overview", label: "大屏总览", href: "hunan-inspection-overview/index.html" },
          { key: "station", label: "站点态势", href: "inspection-3d-sandbox/index.html" },
          { key: "diagnosis", label: "诊断台 / 知识库", href: "diagnosis-flow/index.html" },
          { key: "graph", label: "知识图谱", href: "kg-template/index.html" }
        ];

        var stage = document.getElementById("frameStage");
        var bootMask = document.getElementById("bootMask");
        var frames = {};
        var activeKey = "overview";
        var preloadTimers = [];

        function stepByKey(key) {
          for (var i = 0; i < steps.length; i += 1) {
            if (steps[i].key === key) return steps[i];
          }
          throw new Error("[inspection-demo] 未知组件：" + key);
        }

        function createFrame(step) {
          var frame = document.createElement("iframe");
          frame.className = "demo-frame";
          frame.title = step.label;
          frame.dataset.key = step.key;
          frame.dataset.loaded = "0";
          frame.setAttribute("loading", step.key === "overview" ? "eager" : "lazy");
          frame.addEventListener("load", function () {
            frame.dataset.loaded = "1";
            postVisibility(step.key);
            if (step.key === activeKey) {
              bootMask.classList.add("is-hidden");
            }
          });
          frame.src = step.href;
          stage.appendChild(frame);
          frames[step.key] = frame;
          return frame;
        }

        function ensureFrame(key) {
          return frames[key] || createFrame(stepByKey(key));
        }

        function postVisibility(key) {
          var frame = frames[key];
          if (!frame || !frame.contentWindow) return;
          frame.contentWindow.postMessage({
            type: "inspection-demo:visibility",
            key: key,
            active: key === activeKey
          }, "*");
        }

        function syncFrameVisibility() {
          Object.keys(frames).forEach(postVisibility);
        }

        function setNavActive(key) {
          document.querySelectorAll(".inspection-flow-nav a").forEach(function (link) {
            link.classList.toggle("is-active", link.dataset.key === key);
          });
        }

        function activate(key) {
          var frame = ensureFrame(key);
          if (key === activeKey && frame.classList.contains("is-active")) return;

          activeKey = key;
          Object.keys(frames).forEach(function (frameKey) {
            frames[frameKey].classList.toggle("is-active", frameKey === key);
          });
          syncFrameVisibility();
          setNavActive(key);
          if (frame.dataset.loaded !== "1") bootMask.classList.remove("is-hidden");
          else bootMask.classList.add("is-hidden");
        }

        function idle(fn, timeout) {
          if ("requestIdleCallback" in window) {
            return window.requestIdleCallback(fn, { timeout: timeout || 1600 });
          }
          return window.setTimeout(fn, timeout || 600);
        }

        function preloadRest() {
          var order = ["station", "diagnosis", "graph"];
          order.forEach(function (key, index) {
            preloadTimers.push(window.setTimeout(function () {
              idle(function () { ensureFrame(key); }, 1200);
            }, 500 + index * 700));
          });
        }

        window.InspectionDemoShell = {
          steps: steps,
          currentKey: function () { return activeKey; },
          switchTo: activate
        };

        window.addEventListener("message", function (event) {
          var data = event.data;
          if (!data || data.type !== "inspection-demo:switch") return;
          activate(data.key);
        });

        window.addEventListener("beforeunload", function () {
          preloadTimers.forEach(function (timer) { window.clearTimeout(timer); });
        });

        ensureFrame("overview").classList.add("is-active");
        syncFrameVisibility();
        preloadRest();
      })();
    </script>
    <script src="flow-nav/flow-nav.js"></script>
  </body>
</html>

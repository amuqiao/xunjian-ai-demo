<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站场 3D 巡检地图</title>
    <link rel="stylesheet" href="styles/01-tokens.css">
    <link rel="stylesheet" href="styles/02-shell.css">
    <link rel="stylesheet" href="styles/03-cards.css">
    <link rel="stylesheet" href="styles/04-charts.css">
    <link rel="stylesheet" href="styles/05-map3d.css">
    <link rel="stylesheet" href="styles/06-map-scene.css">
    <link rel="stylesheet" href="styles/07-arealist.css">
    <link rel="stylesheet" href="styles/08-itemlist.css">
    <link rel="stylesheet" href="styles/09-actionbar.css">
    <link rel="stylesheet" href="styles/10-taskcard.css">
    <link rel="stylesheet" href="styles/11-overlay.css">
    <link rel="stylesheet" href="../flow-nav/flow-nav.css">
  </head>
  <body>
    <div id="appRoot" class="app-shell" aria-label="站场 3D 巡检地图"></div>

    <!-- L0 vendor -->
    <script src="vendor/three.min.js"></script>
    <script src="vendor/echarts.min.js"></script>

    <!-- L1 契约（零依赖，必须最先加载） -->
    <script src="scripts/map3d/contract.js"></script>

    <!-- L2 数据（items-entry.js 必须是三个 items-*.js 中最先加载的一个） -->
    <script src="scripts/data/items-entry.js"></script>
    <script src="scripts/data/items-process.js"></script>
    <script src="scripts/data/items-room.js"></script>
    <script src="scripts/data/station.js"></script>
    <script src="scripts/data/series.js"></script>
    <script src="scripts/data/track.js"></script>
    <script src="scripts/data/task.js"></script>
    <script src="scripts/data/flow.js"></script>
    <script src="scripts/data/schema.js"></script>
    <script src="scripts/data/index.js"></script>

    <!-- L3 3D -->
    <script src="scripts/map3d/model-shared.js"></script>
    <script src="scripts/map3d/model-sandbox.js"></script>
    <script src="scripts/map3d/model-track.js"></script>
    <script src="scripts/map3d/engine.js"></script>

    <!-- L4 core -->
    <script src="scripts/core/screen-scale.js"></script>
    <script src="scripts/core/dom.js"></script>
    <script src="scripts/core/charts.js"></script>
    <script src="scripts/core/timers.js"></script>
    <script src="scripts/core/chartopts.js"></script>
    <script src="scripts/core/state.js"></script>

    <!-- L5 ui -->
    <script src="scripts/ui/cards.js"></script>
    <script src="scripts/ui/selectlist.js"></script>
    <script src="scripts/ui/detailcard.js"></script>
    <script src="scripts/ui/itemlist.js"></script>
    <script src="scripts/ui/actionbar.js"></script>
    <script src="scripts/ui/overlay.js"></script>

    <!-- L6 场景 -->
    <script src="scripts/scenes/map.js"></script>
    <script src="scripts/scenes/areapicker.js"></script>
    <script src="scripts/scenes/inspectorpicker.js"></script>
    <script src="scripts/scenes/issuereport.js"></script>

    <!-- L7 引导 -->
    <script src="scripts/boot.js"></script>
    <script src="../flow-nav/flow-nav.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能巡检助手 · 小巡</title>
<style>
:root{
  /* ── 深色主题。与 poc/inspection-demo 另四屏（hunan-overview-v2 等）同一基调，
     切屏时不跳色。原模板是浅色（--bg:#F2F5FA / --panel:#FFFFFF），全部反转。

     【改法】只反转这一组变量，不逐处改元素 —— 页面里所有 var(...) 的引用自动跟着走。
     四色（红/蓝/绿/橙）的**色相保持不变**，只把亮度提上来适配深底：
     深底上 #C7000B 这种暗红几乎看不见，要用 #ff625c 这种亮红。

     ⚠️ soft 系列是最危险的一类：原本是「浅底 + 深字」（.pill.red 用 --red-soft 作底、
     #A4000A 作字）。深色下必须**同时**反转两边 —— soft 变成半透明深色底，
     字色换成上面那组亮色。只改底不改字，就是深字落深底、彻底看不见。
     所以下面每个 -soft 都配了一个同色系的亮色，成对使用。 ── */
  --red:#ff625c; --red-soft:rgba(255,98,92,.15); --red-ink:#ff8f8a;
  --blue:#5a8cff; --blue-600:#7fa6ff; --blue-soft:rgba(90,140,255,.16); --blue-line:rgba(90,140,255,.42);
  --green:#30c69d; --green-soft:rgba(48,198,157,.15); --green-ink:#5fd9b8;
  --amber:#eeb44a; --amber-soft:rgba(238,180,74,.15); --amber-ink:#f3c974;

  /* 文字三档：主/次/弱。原来是 #1B2534 → #47566C → #8494A9（由深到浅），
     深色下反过来：由亮到暗。 */
  --ink:#eaf6fb; --ink-2:#b8cbd9; --ink-3:#87a3b8;

  --line:rgba(120,150,255,.18); --line-2:rgba(120,150,255,.10);
  --bg:#05060f; --panel:#080c1e; --side:#070a16;

  --r-s:8px; --r-m:12px; --r-l:16px;
  /* 阴影从"深蓝色投影"换成"纯黑投影" —— 深底上蓝色阴影会发灰、看着脏。 */
  --sh-s:0 1px 2px rgba(0,0,0,.28);
  --sh-m:0 4px 16px rgba(0,0,0,.34);
  --sh-l:0 10px 40px rgba(0,0,0,.46);
  --fs:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",system-ui,sans-serif;
  font-size:var(--fs); color:var(--ink); background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

.app{display:flex;height:100vh;overflow:hidden}

/* ---------------- 左侧栏 ---------------- */
.sidebar{
  width:246px;flex:0 0 246px;background:var(--side);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
}

/* 侧栏首个元素（原先上面还有一个 .brand 品牌块，已移除 —— 品牌只放外壳顶部条）。
   padding-top 由 14 提到 18：那段留白原先是 .brand 的 padding 提供的。 */
.agent-card{display:flex;gap:10px;align-items:center;padding:18px 16px 14px}
.agent-avatar{width:38px;height:38px;flex:0 0 38px;border-radius:11px;overflow:hidden;box-shadow:var(--sh-s)}
.agent-avatar svg{width:100%;height:100%;display:block}
.agent-meta{min-width:0}
.agent-name{font-size:12.5px;font-weight:600;line-height:1.35;color:var(--ink)}
.agent-status{margin-top:3px;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(18,161,80,.14);animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(18,161,80,.05)}}

.side-block{padding:6px 12px 12px}
.side-title{
  font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--ink-3);
  padding:8px 4px 7px;display:flex;align-items:center;gap:6px
}
.side-hint{font-weight:400;letter-spacing:0;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:10px}

.role-switch{display:flex;flex-direction:column;gap:6px}
.role-btn{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r-m);
  border:1px solid transparent;text-align:left;transition:.16s;width:100%;
}
.role-btn:hover{background:rgba(90,140,255,.12);border-color:var(--line)}
.role-btn.active{background:rgba(90,140,255,.18);border-color:var(--blue-line);box-shadow:0 2px 10px rgba(26,109,224,.10)}
.role-btn .ava{width:30px;height:30px;flex:0 0 30px;border-radius:9px;overflow:hidden}
.role-btn .ava svg{width:100%;height:100%;display:block}
.role-btn .rb-name{font-size:13px;font-weight:600;line-height:1.3}
.role-btn .rb-desc{font-size:11px;color:var(--ink-3);margin-top:2px}
.role-btn.active .rb-name{color:var(--blue-600)}

.task-list,.history-list{list-style:none;display:flex;flex-direction:column;gap:2px}
.task-list li{
  display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:var(--r-s);
  font-size:12px;color:var(--ink-2);transition:.2s
}
.task-list li .tl-dot{width:5px;height:5px;border-radius:50%;flex:0 0 5px;background:var(--ink-3)}
.task-list li .tl-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-list li.is-new{animation:slideIn .45s ease both;background:var(--blue-soft)}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}}
.chip{font-size:10.5px;padding:1px 6px;border-radius:4px;white-space:nowrap;font-weight:500}
.chip.run{background:var(--amber-soft);color:var(--amber-ink)}
.chip.done{background:var(--green-soft);color:var(--green-ink)}
.chip.wait{background:rgba(135,163,184,.14);color:var(--ink-3)}

.history-list li button{
  width:100%;text-align:left;padding:8px;border-radius:var(--r-s);font-size:12px;
  color:var(--ink-2);line-height:1.35;transition:.16s;border:1px solid transparent
}
.history-list li button:hover{background:rgba(90,140,255,.12);border-color:var(--line)}
.history-list li button.active{background:rgba(90,140,255,.16);border-color:var(--line);color:var(--ink);box-shadow:var(--sh-s)}
.history-list .h-date{display:block;font-size:10.5px;color:var(--ink-3);margin-top:3px}

.side-foot{margin-top:auto;padding:10px 12px 14px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
.alarm-entry{
  display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:var(--r-m);
  background:var(--red-soft);color:var(--red-ink);font-size:12.5px;font-weight:500;transition:.16s
}
.alarm-entry:hover{filter:brightness(.98)}
.alarm-ic{width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 16px}
.alarm-entry .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:9px;min-width:18px;padding:1px 5px;font-size:11px;text-align:center}
.foot-link{font-size:12px;color:var(--ink-3);padding:6px;border-radius:var(--r-s);text-align:center}
.foot-link:hover{background:rgba(90,140,255,.12);color:var(--ink-2)}

/* ---------------- 主区 ---------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel);position:relative}
.topbar{
  height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel);z-index:3
}
.topbar-l{display:flex;align-items:center;gap:10px}
.topbar h1{font-size:15px;font-weight:600;letter-spacing:.01em}
.tag{font-size:11.5px;color:var(--blue-600);background:var(--blue-soft);border:1px solid var(--blue-line);padding:2px 8px;border-radius:20px}
.step-indicator{font-size:12px;color:var(--ink-3)}
.step-indicator b{color:var(--blue-600);font-weight:600}

/* [hidden] 必须能压过 display:flex —— 原模板这条是 bug：readonlyBar 上写了 hidden 属性，
   但 .readonly-bar 的 display:flex 优先级更高，所以那条橙色提示条**一直显示**。
   浅色底上它不显眼，转深色后一眼就看出来了。加一条 [hidden] 规则修掉。 */
.readonly-bar[hidden]{display:none}
.readonly-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 22px;background:var(--amber-soft);border-bottom:1px solid rgba(238,180,74,.3);
  font-size:12.5px;color:var(--amber-ink)
}
.readonly-bar button{font-size:12.5px;color:var(--blue-600);font-weight:600}
.readonly-bar button:hover{text-decoration:underline}

.chat-scroll{
  flex:1;overflow-y:auto;scroll-behavior:smooth;
  background:
    radial-gradient(900px 420px at 50% -6%, rgba(90,140,255,.10) 0%, rgba(90,140,255,0) 62%),
    linear-gradient(180deg,rgba(11,26,44,.92) 0%,rgba(6,17,31,.96) 100%);
}
.chat-inner{max-width:1000px;margin:0 auto;padding:26px 26px 8px}

.welcome{text-align:center;padding:46px 0 34px;animation:fadeUp .5s ease both}
.welcome-avatar{width:60px;height:60px;margin:0 auto 16px;border-radius:18px;overflow:hidden;box-shadow:var(--sh-m)}
.welcome-avatar svg{width:100%;height:100%;display:block}
.welcome h2{font-size:23px;font-weight:700;color:var(--blue-600);letter-spacing:.04em}
.welcome p{margin-top:9px;font-size:13.5px;color:var(--ink-3)}

/* --------- 消息 --------- */
.msg{display:flex;gap:11px;margin-bottom:18px;animation:fadeUp .34s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}}
.msg.user{flex-direction:row-reverse}
.msg .ava{width:30px;height:30px;flex:0 0 30px;border-radius:9px;overflow:hidden;box-shadow:var(--sh-s)}
.msg .ava svg{width:100%;height:100%;display:block}
.msg .body{max-width:min(760px,82%);min-width:0}
.msg.user .body{display:flex;justify-content:flex-end}

.bubble{
  background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;
  padding:11px 14px;line-height:1.75;box-shadow:var(--sh-s);color:var(--ink-2);
  white-space:pre-wrap;word-break:break-word
}
.msg.user .bubble{
  background:linear-gradient(135deg,var(--blue) 0%,#7fa6ff 100%);
  color:#fff;border:none;border-radius:14px 4px 14px 14px;box-shadow:0 3px 12px rgba(26,109,224,.24)
}
.bubble .link{color:var(--blue);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.bubble .link:hover{color:var(--blue-600)}
.bubble em{font-style:normal;color:var(--ink);font-weight:600}

.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:bounce 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,70%,100%{transform:translateY(0);opacity:.5}35%{transform:translateY(-5px);opacity:1}}
.caret{display:inline-block;width:2px;height:1em;background:var(--blue);vertical-align:-2px;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* --------- 卡片通用 --------- */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh-m);overflow:hidden
}
.card-head{
  display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-2);
  font-size:13.5px;font-weight:600
}
.card-head .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;flex:0 0 18px}
.ic.ok{background:var(--green)}
.ic.info{background:var(--blue)}
.ic.warn{background:var(--amber)}
.card-head .sub{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--ink-3)}
.card-body{padding:14px 16px}
.card-foot{padding:11px 16px;border-top:1px solid var(--line-2);background:rgba(8,21,37,.6);display:flex;align-items:center;gap:10px}
.card-foot .hint{font-size:12px;color:var(--ink-3)}
.card-foot .spacer{flex:1}

.kv{display:grid;grid-template-columns:96px 1fr;gap:9px 12px;font-size:13px;line-height:1.6}
.kv dt{color:var(--ink-3);text-align:right}
.kv dd{color:var(--ink);word-break:break-word}
.kv dd b{color:var(--blue-600)}

.btn{
  padding:7px 18px;border-radius:8px;font-size:13px;font-weight:600;transition:.16s;
  background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(26,109,224,.24)
}
.btn:hover{background:var(--blue-600)}
.btn:disabled{background:rgba(120,150,255,.20);box-shadow:none;cursor:default}
.btn.ghost{background:rgba(90,140,255,.12);color:var(--ink-2);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--blue-line);color:var(--blue-600)}
.btn.sm{padding:5px 12px;font-size:12px}

/* --------- 摘要 / 指标 --------- */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px}
.stat{background:rgba(16,25,54,.46);border:1px solid var(--line-2);border-radius:var(--r-m);padding:12px 13px}
.stat .s-label{font-size:11.5px;color:var(--ink-3)}
.stat .s-value{font-size:22px;font-weight:700;margin-top:5px;letter-spacing:-.01em}
.stat .s-sub{font-size:11px;color:var(--ink-3);margin-top:3px}
.s-value.good{color:var(--green)} .s-value.bad{color:var(--red)} .s-value.mid{color:var(--amber)}
.s-value.base{color:var(--blue-600)}

/* --------- 进度 --------- */
.steps{display:flex;flex-direction:column;gap:0}
.step-row{display:flex;gap:11px;align-items:flex-start;padding:7px 0;position:relative}
.step-row .st-ic{
  width:18px;height:18px;flex:0 0 18px;border-radius:50%;border:2px solid rgba(120,150,255,.34);background:var(--panel);
  display:grid;place-items:center;font-size:10px;color:#fff;margin-top:1px;z-index:1;transition:.25s
}
.step-row:not(:last-child)::before{content:"";position:absolute;left:8px;top:24px;bottom:-2px;width:2px;background:rgba(120,150,255,.22)}
.step-row.done .st-ic{background:var(--green);border-color:var(--green)}
.step-row.active .st-ic{border-color:var(--blue);background:var(--blue-soft);animation:ring 1.2s infinite}
@keyframes ring{50%{box-shadow:0 0 0 5px rgba(26,109,224,.12)}}
.step-row .st-txt{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.step-row.done .st-txt,.step-row.active .st-txt{color:var(--ink-2)}
.step-row.active .st-txt{color:var(--blue-600);font-weight:500}
.step-row .st-time{margin-left:auto;font-size:11px;color:var(--ink-3)}
.progress-bar{height:5px;border-radius:3px;background:rgba(120,150,255,.14);overflow:hidden;margin-top:12px}
.progress-bar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--blue),#4E9BFF);transition:width .5s ease}

/* --------- 表格 --------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{
  background:rgba(90,140,255,.10);color:var(--ink-2);font-weight:600;text-align:left;
  padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap
}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:rgba(90,140,255,.08)}
.pill{display:inline-block;padding:1.5px 8px;border-radius:20px;font-size:11px;font-weight:500}
.pill.red{background:var(--red-soft);color:var(--red-ink)}
.pill.amber{background:var(--amber-soft);color:var(--amber-ink)}
.pill.green{background:var(--green-soft);color:var(--green-ink)}
.pill.grey{background:rgba(135,163,184,.14);color:var(--ink-3)}
.pill.blue{background:var(--blue-soft);color:var(--blue-600)}

/* --------- 图表 --------- */
.chart-box{width:100%;height:250px}

/* --------- 引导卡 --------- */
.composer-wrap{border-top:1px solid var(--line);background:var(--panel);padding:12px 26px 12px;z-index:3}
.guide-slot{max-width:1000px;margin:0 auto;min-height:0}
.guide-card{
  display:flex;align-items:center;gap:11px;padding:10px 14px;margin-bottom:10px;
  background:linear-gradient(135deg,rgba(90,140,255,.14) 0%,rgba(11,26,44,.6) 60%);
  border:1px solid var(--blue-line);border-radius:12px;width:100%;text-align:left;
  box-shadow:0 3px 14px rgba(26,109,224,.10);transition:.18s;animation:guideIn .4s ease both
}
@keyframes guideIn{from{opacity:0;transform:translateY(7px)}}
.guide-card:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(26,109,224,.17);border-color:var(--blue)}
.guide-card .g-ic{
  width:22px;height:22px;flex:0 0 22px;border-radius:7px;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-size:12px;animation:breathe 2.6s ease-in-out infinite
}
@keyframes breathe{50%{box-shadow:0 0 0 6px rgba(26,109,224,.10)}}
.guide-card .g-label{font-size:10.5px;color:var(--blue-600);letter-spacing:.08em;font-weight:600}
.guide-card .g-text{font-size:13.5px;color:var(--ink);margin-top:2px;line-height:1.45}
.guide-card .g-go{margin-left:auto;font-size:12px;color:var(--blue-600);font-weight:600;white-space:nowrap}
.guide-done{
  display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;margin-bottom:10px;
  background:rgba(16,25,54,.40);border:1px dashed var(--line);border-radius:12px;font-size:12.5px;color:var(--ink-3)
}
.guide-done b{color:var(--green);font-weight:600}
.guide-done button{color:var(--blue-600);font-weight:600;font-size:12.5px}
.guide-done button:hover{text-decoration:underline}
.guide-waiting{
  padding:11px 14px;margin-bottom:10px;border-radius:12px;border:1px dashed var(--blue-line);
  background:rgba(90,140,255,.10);font-size:12.5px;color:var(--blue-600);text-align:center
}

.composer{
  max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px;
  border:1.5px solid var(--blue-line);border-radius:12px;padding:6px 6px 6px 16px;
  background:var(--side);transition:.18s
}
.composer:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(26,109,224,.08)}
.composer input{flex:1;border:none;outline:none;font-size:13.5px;padding:9px 0;background:transparent;color:var(--ink)}
.composer input::placeholder{color:#6b8199}
.composer input:disabled{cursor:not-allowed}
#btnSend{width:34px;height:34px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;transition:.16s}
#btnSend svg{width:17px;height:17px;transform:rotate(90deg)}
#btnSend:hover{background:var(--blue-600)}
#btnSend:disabled{background:rgba(120,150,255,.20);cursor:default}
.composer-tip{max-width:1000px;margin:8px auto 0;font-size:11.5px;color:#A6B3C4;text-align:center}

/* --------- 抽屉 --------- */
/* ══ 报告抽屉：**刻意保持浅色** ══
   它是一份纸质报告的预览（与 poc/beng-demo/diagnosis-flow-v2 的 A4 报告同一逻辑：
   那份 styles/05-report.css 文件头也写明「它是浅色的（一份纸质报告），与深色主题无关」）。
   深色主体 + 浅色报告的对比，正好强化"这是一份能拿去用的文件"。

   ⚠️ 但主体转深色之后，报告内部所有 var(--ink*) / var(--line) 都跟着变亮了 ——
   白底 + 亮字 = 看不见。所以在这里把那几个变量**按作用域重置回浅色主题的原值**：
   变量在 .drawer 内重新声明，内部所有引用自动拿到浅色值，不需要逐条改 .rpt-* 规则。
   这是转深色时最容易漏的一处：改完主体一看"报告一片空白"，其实是字变白了。 */
.drawer{
  --ink:#1B2534; --ink-2:#47566C; --ink-3:#8494A9;
  --line:#E4EAF2; --line-2:#EFF3F8;
  --red:#C7000B; --green:#12A150; --amber:#D98200;
  --blue:#1A6DE0; --blue-600:#1558BC;
  --blue-soft:#EAF2FF; --blue-line:#CBDDFA;

  color:var(--ink);
  width:0;flex:0 0 0;background:#fff;border-left:1px solid var(--line);

.drawer.open{width:520px;flex:0 0 520px;box-shadow:var(--sh-l)}
.drawer-head{

.drawer-head h3{font-size:14.5px;font-weight:600}
.drawer-actions{display:flex;align-items:center;gap:6px}
.ghost-btn{font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:7px;padding:4px 11px}
.ghost-btn:hover{border-color:var(--blue-line);color:var(--blue-600)}
.icon-btn{width:28px;height:28px;border-radius:7px;font-size:20px;color:var(--ink-3);display:grid;place-items:center;line-height:1}
.icon-btn:hover{background:rgba(90,140,255,.14);color:var(--ink)}
.drawer-body{flex:1;overflow-y:auto;padding:22px 24px 40px}

.rpt-title{text-align:center;font-size:18px;font-weight:700;letter-spacing:.05em;padding-bottom:14px}
.rpt-title .rpt-sub{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3);letter-spacing:0;margin-top:6px}
.rpt-sec{margin-top:20px}
.rpt-sec > h4{
  font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:10px;
  padding-left:9px;border-left:3px solid var(--blue);line-height:1.2
}
.rpt-lines{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.rpt-lines span b{color:var(--ink);font-weight:600}
.rpt-flag{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin:14px 0 8px}
.rpt-flag.bad{color:var(--red)} .rpt-flag.good{color:var(--green)}
.rpt-zone{font-size:12.5px;font-weight:600;margin:12px 0 8px;color:var(--ink)}
.rpt-zone span{font-weight:400;color:var(--ink-3)}
.rpt-zone b{color:var(--green)}
.rpt-empty{font-size:12.5px;color:var(--ink-3);padding:8px 12px;background:#F7FAFD;border-radius:8px}
.rpt-list{list-style:none;display:flex;flex-direction:column;gap:9px}
.rpt-list li{display:flex;gap:9px;font-size:12.5px;color:var(--ink-2);line-height:1.65}
.rpt-list li i{
  width:17px;height:17px;flex:0 0 17px;border-radius:5px;background:var(--blue-soft);color:var(--blue-600);
  font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:2px
}
.rpt-sign{margin-top:26px;padding-top:14px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--ink-3);display:flex;justify-content:space-between}

/* --------- toast --------- */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);
  background:rgba(27,37,52,.94);color:#fff;font-size:13px;padding:10px 18px;border-radius:10px;
  opacity:0;pointer-events:none;transition:.28s;z-index:99;box-shadow:var(--sh-l)
}
.toast.show{opacity:1;transform:translate(-50%,0)}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(120,150,255,.26);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(120,150,255,.40)}
::-webkit-scrollbar-track{background:transparent}

@media (max-width:1280px){ .drawer.open{width:440px;flex:0 0 440px} }
@media (max-width:1040px){
  .sidebar{width:200px;flex:0 0 200px}

}
@media print{
  .sidebar,.main,.toast{display:none!important}
  .drawer,.drawer.open{width:100%!important;flex:1!important;border:none;box-shadow:none}
  .drawer-head{display:none}
  .drawer-body{overflow:visible;padding:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}

}

<!-- ECharts 本地副本。**不要改回 CDN** —— 这套 demo 要能拷给业务方离线双击运行，
     任何外链在断网环境下都会让图表整块空白（而且不报错，只是图不出来）。
     本地这份是 5.6.0（CDN 原先引的是 5.5.0，小版本升级、API 兼容），
     与本课题另外几个屏用的是同一个文件（全仓 7 份副本 md5 一致）。 -->
<script src="hunan-inspection-overview/vendor/echarts.min.js"></script>
<script>
/* =========================================================================
 *  剧本与演示数据 —— 全部演示内容集中在此文件，修改文案不需要动 app.js

 *    - poc/inspection-demo/hunan-overview-v2（复用 hunan-inspection-overview 的
 *      scripts/data/quality.js）—— 全省 6 个作业区口径：岳阳/长沙/衡阳/永郴/湘娄/株洲，

/* ---------------- 头像（SVG 直出，无外部图片依赖） ---------------- */
const AVATARS = {

/* ---------------- 26 条站场巡检项核查表（3 个部位：P-4泵棚 / 低压配电室 / PLC机房） ----------------

/* ---------------- 业务措辞（唯一真源） ----------------

              ['报告构成', '周期概览 / 完成率趋势 / 作业区排名 / 行为异常与AI提醒 / 结论与建议']
            ],
            footHint: '周报已自动归档，可导出后用于周例会',
            action: { label: '打开周报', report: 'weekly' }
          }
        ],
        onDone: { taskDone: '本周巡检管理周报待生成', toast: '周报 ZB-2026W29 已生成并归档' }

<script>
/* =========================================================================
 *  演示引擎：剧本推进、消息渲染、报告抽屉
 * ========================================================================= */
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const clone = o => JSON.parse(JSON.stringify(o));
  const OPTIONS = { TEAM_BAR: TEAM_BAR_OPTION, RPT_TREND: RPT_TREND_OPTION };

  /* ---------------- 状态 ---------------- */
  const state = {
    role: 'inspector',
    mode: 'live',          // live | history
    historyId: null,
    playing: false,
    skip: false,
    charts: [],
    conv: {}
  };

  function freshConv(key) {
    const sc = SCENARIOS[key];
    return { records: [], idx: 0, tasks: clone(sc.tasks), alarm: sc.alarmCount };
  }
  Object.keys(SCENARIOS).forEach(k => { state.conv[k] = freshConv(k); });

  const scen = () => SCENARIOS[state.role];
  const conv = () => state.conv[state.role];

  /* =======================================================================
   *  左侧栏
   * ===================================================================== */
  function renderSidebar() {
    const sc = scen(), cv = conv();

    $('agentAvatarSide').innerHTML = AVATARS.agent;
    $('welcomeAvatar').innerHTML = AVATARS.agent;

    // 角色切换
    const rs = $('roleSwitch');
    rs.innerHTML = '';
    ['inspector', 'manager'].forEach(k => {
      const s = SCENARIOS[k];
      const b = el('button', 'role-btn' + (k === state.role && state.mode === 'live' ? ' active' : ''));
      b.innerHTML = `<span class="ava">${AVATARS[k]}</span>
        <span><span class="rb-name">${s.name}</span><span class="rb-desc">${s.desc}</span></span>`;
      b.onclick = () => switchRole(k);
      rs.appendChild(b);
    });

    // 任务列表
    $('taskTitle').textContent = sc.taskTitle;
    const tl = $('taskList');
    tl.innerHTML = '';
    cv.tasks.forEach(t => {
      const li = el('li', t._new ? 'is-new' : '');
      const label = { run: '进行中', done: '已完成', wait: '待处理' }[t.status];
      li.innerHTML = `<i class="tl-dot" style="background:${t.color}"></i>
        <span class="tl-name" title="${t.name}">${t.name}</span>
        <span class="chip ${t.status}">${label}</span>`;
      tl.appendChild(li);
      if (t._new) setTimeout(() => { t._new = false; li.classList.remove('is-new'); }, 1400);
    });

    // 历史对话
    const hl = $('historyList');
    hl.innerHTML = '';
    HISTORY.forEach(h => {
      const li = el('li');
      const b = el('button', state.mode === 'history' && state.historyId === h.id ? 'active' : '');
      b.innerHTML = `${h.title}<span class="h-date">${h.date}</span>`;
      b.onclick = () => openHistory(h.id);
      li.appendChild(b);
      hl.appendChild(li);
    });

    $('alarmLabel').textContent = sc.alarmLabel;
    $('alarmCount').textContent = cv.alarm;
  }

  /* =======================================================================
   *  消息渲染
   * ===================================================================== */
  const msgBox = () => $('messages');

  function scrollDown() {
    const s = $('chatScroll');
    requestAnimationFrame(() => { s.scrollTop = s.scrollHeight; });
  }

  function addUserMsg(text) {
    const m = el('div', 'msg user');
    m.innerHTML = `<span class="ava">${AVATARS[state.role]}</span>
      <div class="body"><div class="bubble">${text}</div></div>`;
    msgBox().appendChild(m);
    scrollDown();
  }

  function agentShell() {
    const m = el('div', 'msg agent');
    m.innerHTML = `<span class="ava">${AVATARS.agent}</span><div class="body"></div>`;
    msgBox().appendChild(m);
    return m.querySelector('.body');
  }

  /* --- 打字机（支持 <em> 强调） --- */
  function typeInto(node, html, cb) {
    const tmp = el('div', null, html);
    const chars = [];
    tmp.childNodes.forEach(n => {
      const em = n.nodeType === 1 && n.tagName === 'EM';
      (n.textContent || '').split('').forEach(c => chars.push({ c, em }));
    });
    let i = 0;
    const bubble = el('div', 'bubble');
    node.appendChild(bubble);
    const paint = n => {
      let out = '', open = false;
      for (let k = 0; k < n; k++) {
        const ch = chars[k];
        if (ch.em && !open) { out += '<em>'; open = true; }
        if (!ch.em && open) { out += '</em>'; open = false; }
        out += ch.c === '\n' ? '<br>' : ch.c;
      }
      if (open) out += '</em>';
      return out;
    };
    const tick = () => {
      if (state.skip) { bubble.innerHTML = paint(chars.length); cb && cb(); return; }
      i += 2;
      bubble.innerHTML = paint(Math.min(i, chars.length)) + '<span class="caret"></span>';
      scrollDown();
      if (i >= chars.length) { bubble.innerHTML = paint(chars.length); cb && cb(); }
      else setTimeout(tick, 26);
    };
    tick();
  }

  function thinking(node) {
    const t = el('div', 'bubble', '<span class="typing"><i></i><i></i><i></i></span>');
    node.appendChild(t);
    scrollDown();
    return t;
  }

  /* --- 卡片构件 --- */
  function cardShell(item) {
    const c = el('div', 'card');
    c.innerHTML = `<div class="card-head">
        <span class="ic ${item.headIc || 'info'}">${item.headIc === 'ok' ? '✓' : item.headIc === 'warn' ? '!' : 'i'}</span>
        <span>${item.head}</span>${item.sub ? `<span class="sub">${item.sub}</span>` : ''}
      </div><div class="card-body"></div>`;
    return c;
  }
  function cardFoot(c, hint, buttons) {
    if (!hint && !(buttons && buttons.length)) return;
    const f = el('div', 'card-foot');
    if (hint) f.appendChild(el('span', 'hint', hint));
    f.appendChild(el('span', 'spacer'));
    (buttons || []).forEach(b => f.appendChild(b));
    c.appendChild(f);
  }
  function tableHTML(columns, rows) {
    const th = columns.map(c => `<th>${c}</th>`).join('');
    const tr = rows.map(r => '<tr>' + r.map(cell =>
      `<td>${typeof cell === 'object' ? `<span class="pill ${cell.pill}">${cell.text}</span>` : cell}</td>`
    ).join('') + '</tr>').join('');
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
  }

  /* --- 渲染单个回复（animate=false 用于切换角色时重放） --- */
  function renderItem(node, item, rec, animate, done) {
    const finish = () => { scrollDown(); done && done(); };

    if (item.type === 'text') {
      if (animate) typeInto(node, item.text, finish);
      else { node.appendChild(el('div', 'bubble', item.text)); finish(); }
      return;
    }

    const c = cardShell(item);
    const body = c.querySelector('.card-body');

    if (item.type === 'stats') {
      const row = el('div', 'stat-row');
      item.items.forEach(s => row.insertAdjacentHTML('beforeend',
        `<div class="stat"><div class="s-label">${s.label}</div>
         <div class="s-value ${s.tone || ''}">${s.value}</div>
         ${s.sub ? `<div class="s-sub">${s.sub}</div>` : ''}</div>`));
      body.appendChild(row);
      cardFoot(c, item.footHint, item.action ? [actionBtn(item.action)] : []);
      node.appendChild(c); finish();

    } else if (item.type === 'kv') {
      const dl = el('dl', 'kv');
      item.fields.forEach(([k, v]) => { dl.insertAdjacentHTML('beforeend', `<dt>${k}</dt><dd>${v}</dd>`); });
      body.appendChild(dl);
      cardFoot(c, item.footHint, item.action ? [actionBtn(item.action)] : []);
      node.appendChild(c); finish();

    } else if (item.type === 'table') {
      body.innerHTML = tableHTML(item.columns, item.rows);
      cardFoot(c, item.footHint, item.action ? [actionBtn(item.action)] : []);
      node.appendChild(c); finish();

    } else if (item.type === 'chart') {
      const id = 'chart_' + Math.random().toString(36).slice(2, 8);
      body.appendChild(el('div', 'chart-box', '')).id = id;
      cardFoot(c, item.footHint, []);
      node.appendChild(c);
      mountChart(id, OPTIONS[item.option]);
      finish();

    } else if (item.type === 'parse') {
      const dl = el('dl', 'kv');
      item.fields.forEach(([k, v]) => { dl.insertAdjacentHTML('beforeend', `<dt>${k}</dt><dd>${v}</dd>`); });
      body.appendChild(dl);
      const btn = el('button', 'btn', rec && rec.confirmed ? '已确认' : item.confirm);
      if (rec && rec.confirmed) btn.disabled = true;
      else btn.onclick = () => { btn.disabled = true; btn.textContent = '已确认'; rec.confirmed = true; sendStep(true); };
      cardFoot(c, item.footHint, [btn]);
      node.appendChild(c); finish();

    } else if (item.type === 'progress') {
      const list = el('div', 'steps');
      item.steps.forEach(([txt], i) => list.insertAdjacentHTML('beforeend',
        `<div class="step-row" data-i="${i}"><span class="st-ic">✓</span>
         <span class="st-txt">${txt}</span><span class="st-time"></span></div>`));
      body.appendChild(list);
      const bar = el('div', 'progress-bar', '<i></i>');
      body.appendChild(bar);
      node.appendChild(c);

      const rows = list.querySelectorAll('.step-row');
      const fill = bar.querySelector('i');
      const tail = () => {
        c.querySelector('.card-head span:nth-child(2)').textContent = WORDING.taskDone;
        c.querySelector('.card-head .ic').className = 'ic ok';
        c.querySelector('.card-head .ic').textContent = '✓';
        const t = el('div', 'bubble');
        t.innerHTML = item.doneText + ' 附报告 <span class="link" data-rpt="' + item.report + '">【' + (item.reportLabel || '查看完整报告') + '】</span>';
        node.appendChild(t);
        t.querySelector('.link').onclick = () => openReport(item.report);
        finish();
      };

      if (!animate) {
        rows.forEach(r => r.classList.add('done'));
        fill.style.width = '100%';
        tail(); return;
      }
      let i = 0;
      const run = () => {
        if (i > 0) { rows[i - 1].classList.remove('active'); rows[i - 1].classList.add('done'); rows[i - 1].querySelector('.st-time').textContent = '完成'; }
        fill.style.width = Math.round(i / rows.length * 100) + '%';
        if (i >= rows.length) { setTimeout(() => { tail(); openReport(item.report); }, 320); return; }
        rows[i].classList.add('active');
        scrollDown();
        const d = state.skip ? 60 : item.steps[i][1];
        i++;
        setTimeout(run, d);
      };
      run();

    } else { finish(); }
  }

  function actionBtn(a) {
    const b = el('button', 'btn sm', a.label);
    b.onclick = () => { if (a.report) openReport(a.report); if (a.toast) toast(a.toast); };
    return b;
  }

  function mountChart(id, option) {
    if (!option || typeof echarts === 'undefined') {
      const box = document.getElementById(id);
      if (box) box.innerHTML = '<div class="rpt-empty">图表组件加载中，请检查网络连接</div>';
      return;
    }
    requestAnimationFrame(() => {
      const box = document.getElementById(id);
      if (!box) return;
      const ch = echarts.init(box);
      ch.setOption(option);
      state.charts.push(ch);
    });
  }

  /* =======================================================================
   *  剧本推进
   * ===================================================================== */
  function sendStep(fromConfirm) {
    const cv = conv(), sc = scen();
    const step = sc.steps[cv.idx];
    if (!step || state.playing) return;
    if (step.via === 'confirm' && !fromConfirm) return;

    state.playing = true;
    state.skip = false;
    $('welcome').style.display = 'none';
    addUserMsg(step.user);
    cv.records.push({ who: 'user', text: step.user });
    applyEffects(step.effects);
    renderGuide();

    const node = agentShell();
    const rec = { who: 'agent', items: step.replies, step: step };
    cv.records.push(rec);

    let i = 0;
    const next = () => {
      if (i >= step.replies.length) {
        state.playing = false;
        cv.idx++;
        applyEffects(step.onDone);
        renderGuide();
        renderSidebar();
        return;
      }
      const item = step.replies[i];
      const dots = thinking(node);
      setTimeout(() => {
        dots.remove();
        renderItem(node, item, rec, true, () => { i++; next(); });
      }, state.skip ? 80 : (item.delay || 600));
    };
    next();
  }

  function applyEffects(eff) {
    if (!eff) return;
    const cv = conv();
    const add = eff.addTask || eff.taskAdd;
    if (add) cv.tasks.unshift(Object.assign({ _new: true }, add));
    if (eff.taskDone) {
      const t = cv.tasks.find(x => x.name === eff.taskDone);
      if (t) { t.status = 'done'; t.color = '#30c69d'; }
    }
    if (typeof eff.alarm === 'number') cv.alarm = eff.alarm;
    if (eff.toast) toast(eff.toast);
    renderSidebar();
  }

  /* --- 引导卡：同一时刻只出现一句 --- */
  function renderGuide() {
    const slot = $('guideSlot');
    slot.innerHTML = '';
    const input = $('userInput'), send = $('btnSend');

    if (state.mode === 'history') {
      input.disabled = send.disabled = true;
      input.placeholder = '历史对话为只读记录，无法继续提问';
      $('stepIndicator').textContent = '';
      return;
    }
    input.disabled = send.disabled = false;
    input.placeholder = scen().placeholder;

    const cv = conv(), sc = scen();
    $('stepIndicator').innerHTML = `演示进度 <b>${Math.min(cv.idx, sc.steps.length)}</b> / ${sc.steps.length}`;

    if (state.playing) {
      slot.appendChild(el('div', 'guide-waiting', WORDING.agentBusy));
      return;
    }
    const step = sc.steps[cv.idx];
    if (!step) {
      const d = el('div', 'guide-done', '<b>✓</b> 本条演示路线已走完，可切换使用者或重新开始 &nbsp;');
      const b = el('button', null, '重置当前对话');
      b.onclick = resetConv;
      d.appendChild(b);
      slot.appendChild(d);
      return;
    }
    if (step.via === 'confirm') {
      slot.appendChild(el('div', 'guide-waiting', WORDING.confirmHint));
      return;
    }
    const g = el('button', 'guide-card');
    g.innerHTML = `<span class="g-ic">↳</span>
      <span><span class="g-label">下一步 · 点击即以 ${scen().name} 的身份提问</span>
      <span class="g-text">${step.user}</span></span>
      <span class="g-go">发送 →</span>`;
    g.onclick = () => sendStep(false);
    slot.appendChild(g);
  }

  /* --- 手动输入：模糊匹配当前步骤 --- */
  function manualSend() {
    if (state.mode === 'history' || state.playing) return;
    const input = $('userInput');
    const v = input.value.trim();
    if (!v) return;
    input.value = '';
    const cv = conv(), sc = scen(), step = sc.steps[cv.idx];
    if (step && step.via !== 'confirm' && (step.keywords || []).some(k => v.includes(k))) { sendStep(false); return; }
    if (step && step.via === 'confirm' && (v.includes('确认') || v.includes('是'))) { sendStep(true); return; }

    $('welcome').style.display = 'none';
    addUserMsg(v);
    const node = agentShell();
    const dots = thinking(node);
    setTimeout(() => {
      dots.remove();
      const tip = step
        ? `这个问题我暂时没有对应的数据权限。您可以试试：<em>${step.user}</em>`
        : '本条演示路线已经走完，您可以重置当前对话，或切换到另一位使用者继续体验。';
      typeInto(node, tip, scrollDown);
    }, 700);
  }

  /* =======================================================================
   *  角色切换 / 历史 / 重置
   * ===================================================================== */
  function replayRecords() {
    state.charts.forEach(c => c.dispose && c.dispose());
    state.charts = [];
    msgBox().innerHTML = '';
    const cv = conv();
    $('welcome').style.display = cv.records.length ? 'none' : '';
    cv.records.forEach(r => {
      if (r.who === 'user') addUserMsg(r.text);
      else { const node = agentShell(); r.items.forEach(it => renderItem(node, it, r, false)); }
    });
    scrollDown();
  }

  function switchRole(k) {
    if (state.mode === 'live' && k === state.role) return;
    state.role = k;
    state.mode = 'live';
    state.historyId = null;
    state.playing = false;
    $('readonlyBar').hidden = true;
    $('convTag').textContent = SCENARIOS[k].tag;
    $('welcomeText').textContent = SCENARIOS[k].welcome;
    replayRecords();
    renderSidebar();
    renderGuide();
  }

  function openHistory(id) {
    const h = HISTORY.find(x => x.id === id);
    if (!h) return;
    state.mode = 'history';
    state.historyId = id;
    state.charts.forEach(c => c.dispose && c.dispose());
    state.charts = [];
    msgBox().innerHTML = '';
    $('welcome').style.display = 'none';
    $('readonlyBar').hidden = false;
    $('convTag').textContent = h.title;
    h.messages.forEach(m => {
      if (m.role === 'user') addUserMsg(m.text);
      else { const node = agentShell(); node.appendChild(el('div', 'bubble', m.text)); }
    });
    closeDrawer();
    renderSidebar();
    renderGuide();
    scrollDown();
  }

  function backToLive() {
    state.mode = 'live';
    state.historyId = null;
    $('readonlyBar').hidden = true;
    $('convTag').textContent = scen().tag;
    replayRecords();
    renderSidebar();
    renderGuide();
  }

  function resetConv() {
    if (state.mode === 'history') { backToLive(); return; }
    state.conv[state.role] = freshConv(state.role);
    state.playing = false;
    closeDrawer();
    replayRecords();
    renderSidebar();
    renderGuide();
    toast('当前对话已重置');
  }

  /* =======================================================================
   *  报告抽屉
   * ===================================================================== */
  function openReport(key) {
    const r = REPORTS[key];
    if (!r) return;
    $('drawerTitle').textContent = r.drawerTitle;
    const b = $('drawerBody');
    b.innerHTML = `<div class="rpt-title">${r.title}<span class="rpt-sub">${r.subtitle}</span></div>`;

    r.sections.forEach(s => {
      const sec = el('div', 'rpt-sec');
      sec.innerHTML = `<h4>${s.no ? s.no + '、' : ''}${s.name}</h4>`;

      if (s.type === 'lines') {
        const box = el('div', 'rpt-lines');
        s.lines.forEach(([k, v]) => box.insertAdjacentHTML('beforeend', `<span>${k}：<b>${v}</b></span>`));
        sec.appendChild(box);

      } else if (s.type === 'result') {
        sec.insertAdjacentHTML('beforeend',
          `<div class="rpt-lines"><span>合格率：<b style="color:var(--green);font-size:15px">${s.pass}</b></span>
           ${s.extra ? `<span style="color:var(--ink-3)">${s.extra}</span>` : ''}</div>`);

      } else if (s.type === 'items') {
        sec.insertAdjacentHTML('beforeend',
          `<div class="rpt-flag bad">${WORDING.badFlag}</div>
           <div class="rpt-empty">${WORDING.emptyText}</div>
           <div class="rpt-flag good">${WORDING.goodFlag}</div>
           <div class="rpt-zone">${s.zone} <span>（该区域合格点位 <b>${s.passText.split('/')[0]}</b>/${s.passText.split('/')[1]}）</span></div>`);
        sec.insertAdjacentHTML('beforeend', tableHTML(s.columns, s.rows));

      } else if (s.type === 'table') {
        sec.insertAdjacentHTML('beforeend', tableHTML(s.columns, s.rows));

      } else if (s.type === 'list') {
        const ul = el('ul', 'rpt-list');
        s.items.forEach((t, i) => ul.insertAdjacentHTML('beforeend', `<li><i>${i + 1}</i><span>${t}</span></li>`));
        sec.appendChild(ul);

      } else if (s.type === 'chart') {
        const box = el('div', 'chart-box');
        box.id = 'rptchart_' + Math.random().toString(36).slice(2, 8);
        sec.appendChild(box);
        setTimeout(() => mountChart(box.id, OPTIONS.RPT_TREND), 60);
      }
      b.appendChild(sec);
    });

    b.insertAdjacentHTML('beforeend',
      `<div class="rpt-sign"><span>${r.sign.left}</span><span>${r.sign.right}</span></div>`);

    $('drawer').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');
    setTimeout(() => state.charts.forEach(c => c.resize && c.resize()), 420);
  }

  function closeDrawer() {
    $('drawer').classList.remove('open');
    $('drawer').setAttribute('aria-hidden', 'true');
    setTimeout(() => state.charts.forEach(c => c.resize && c.resize()), 420);
  }

  /* ---------------- toast ---------------- */
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  /* =======================================================================
   *  事件绑定
   * ===================================================================== */
  $('btnSend').onclick = manualSend;
  $('userInput').addEventListener('keydown', e => { if (e.key === 'Enter') manualSend(); });
  $('btnReset').onclick = resetConv;
  $('btnBackLive').onclick = backToLive;
  $('btnCloseDrawer').onclick = closeDrawer;
  $('btnPrint').onclick = () => window.print();
  $('alarmEntry').onclick = () => {
    if (state.mode === 'history') return;
    toast(state.role === 'inspector' ? '今日 3 条异常已在对话中展示，可继续按提示卡操作' : '7 条待闭环异常已纳入本周周报统计');
  };

  document.addEventListener('keydown', e => {
    const typing = document.activeElement === $('userInput');
    if (e.key === ' ' && !typing) { state.skip = true; e.preventDefault(); }
    if ((e.key === 'r' || e.key === 'R') && !typing) resetConv();
    if (e.key === 'Escape') closeDrawer();
  });
  window.addEventListener('resize', () => state.charts.forEach(c => c.resize && c.resize()));

  /* ---------------- 启动 ---------------- */
  $('convTag').textContent = scen().tag;
  $('welcomeText').textContent = scen().welcome;
  renderSidebar();
  renderGuide();
})();

</script>
</body>
</html>

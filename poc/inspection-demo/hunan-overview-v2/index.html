<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>湖南省油气管网大屏 · 巡检站总览 v2</title>

    <!-- 本目录自己的四片：token / 外壳 / 卡片 / 场景网格 -->
    <link rel="stylesheet" href="styles/01-tokens.css">
    <link rel="stylesheet" href="styles/02-shell.css">
    <link rel="stylesheet" href="styles/03-cards.css">
    <!-- 复用旧目录原文件（一字未改）：图表宿主盒 + 3D 地图的冻结契约样式。
         05-hunan3d.css 是禁改区，它读的变量名单在 styles/01-tokens.css 里逐条保留。 -->
    <link rel="stylesheet" href="../hunan-inspection-overview/styles/04-charts.css">
    <link rel="stylesheet" href="../hunan-inspection-overview/styles/05-hunan3d.css">
    <link rel="stylesheet" href="styles/06-overview-scene.css">
  </head>
  <body>
    <div id="appRoot" class="app-shell" aria-label="湖南省油气管网大屏 · 巡检站总览"></div>

    <!-- ===================================================================
         【依赖策略】3D 层、数据层、契约层、vendor 与 core 的四个通用文件全部用相对
         路径直接引用 ../hunan-inspection-overview/ 下的原文件，**不复制副本**。

         这样做的前提已经核实过：那批文件不加载任何外部资源。engine.js 的文件头写明
         「没有引入 TextureLoader——file:// 下会被 CORS 拒绝且 three r160 会静默吞掉
         SecurityError、渲染成纯黑还不报错」，所有材质都是纯色；geo 数据也是内联 JS
         而不是 .json fetch。所以跨目录引用在 file:// 双击打开时同样成立。

         好处是「3D 与数据不动」是字面意义上的不动：这里和旧目录读的是同一份字节，
         不会出现两份副本各自漂移。旧目录仍可独立运行，随时对比。

         本目录自己新写的只有 4 个 JS：core/chartopts.js、scenes/overview.js、
         boot.js（另加 verify/verify_overview.js 不在页面里）。
         =================================================================== -->

    <!-- L0 vendor -->
    <script src="../hunan-inspection-overview/vendor/three.min.js"></script>
    <script src="../hunan-inspection-overview/vendor/echarts.min.js"></script>

    <!-- L1 契约（零依赖，必须最先加载；scripts/ui/cards.js 在 IIFE 顶部就读
         HunanContract.STATUSES，顺序不能倒） -->
    <script src="../hunan-inspection-overview/scripts/map3d/contract.js"></script>

    <!-- L2 数据 -->
    <script src="../hunan-inspection-overview/scripts/data/geo.js"></script>
    <script src="../hunan-inspection-overview/scripts/data/sites.js"></script>
    <script src="../hunan-inspection-overview/scripts/data/series.js"></script>
    <script src="../hunan-inspection-overview/scripts/data/quality.js"></script>

    <!-- L3 3D model + engine（model-map -> model-sites -> model-pipelines 的顺序不能
         变：model-pipelines.js 末尾装配 window.HunanMapModel 时依赖前两个已经把
         window.HunanModelMap / window.HunanModelSites 挂好） -->
    <script src="../hunan-inspection-overview/scripts/map3d/model-map.js"></script>
    <script src="../hunan-inspection-overview/scripts/map3d/model-sites.js"></script>
    <script src="../hunan-inspection-overview/scripts/map3d/model-pipelines.js"></script>
    <script src="../hunan-inspection-overview/scripts/map3d/engine.js"></script>

    <!-- L4 core：前四个复用旧目录，chartopts.js 是本目录新写的 -->
    <script src="../hunan-inspection-overview/scripts/core/screen-scale.js"></script>
    <script src="../hunan-inspection-overview/scripts/core/dom.js"></script>
    <script src="../hunan-inspection-overview/scripts/core/charts.js"></script>
    <script src="../hunan-inspection-overview/scripts/core/timers.js"></script>
    <script src="scripts/core/chartopts.js"></script>

    <!-- L5 ui：只用 cards.js。selectlist.js / detailcard.js / overlay.js 在本 POC 里
         没有渲染路径，不加载（理由见 styles/03-cards.css 与 scripts/boot.js 的文件头） -->
    <script src="../hunan-inspection-overview/scripts/ui/cards.js"></script>

    <!-- L6 场景 -->
    <script src="scripts/scenes/overview.js"></script>

    <!-- L7 引导 -->
    <script src="scripts/boot.js"></script>
  </body>
</html>

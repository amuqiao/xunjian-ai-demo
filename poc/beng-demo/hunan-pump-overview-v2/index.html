<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>湖南公司输油泵机组运行监督 v2</title>

    <!-- 本目录自己的四片：token / 外壳 / 卡片 / 场景网格 -->
    <link rel="stylesheet" href="styles/01-tokens.css">
    <link rel="stylesheet" href="styles/02-shell.css">
    <link rel="stylesheet" href="styles/03-cards.css">
    <!-- 复用旧目录原文件（一字未改）：图表宿主盒 + 3D 地图的冻结契约样式。
         05-hunan3d.css 是禁改区，它读的变量名单在 styles/01-tokens.css 里逐条保留。 -->
    <link rel="stylesheet" href="../hunan-pump-overview/styles/04-charts.css">
    <link rel="stylesheet" href="../hunan-pump-overview/styles/05-hunan3d.css">
    <link rel="stylesheet" href="styles/06-overview-scene.css">
  </head>
  <body>
    <div id="appRoot" class="app-shell" aria-label="湖南公司输油泵机组运行监督"></div>

    <!-- ===================================================================
         【依赖策略】3D 层、地理/拓扑数据、契约层、vendor 与 core 的四个通用文件全部用
         相对路径直接引用 ../hunan-pump-overview/ 下的原文件，**不复制副本**。

         前提已核实：那批文件不加载任何外部资源。engine.js 的文件头写明「没有引入
         TextureLoader —— file:// 下会被 CORS 拒绝且 three r160 会静默吞掉 SecurityError、
         渲染成纯黑还不报错」，所有材质都是纯色；geo 数据是内联 JS 而不是 .json fetch。
         所以跨目录引用在 file:// 双击打开时同样成立。

         好处是「3D 不动」是字面意义上的不动：这里和旧目录读的是同一份字节，不会两边漂移。
         旧目录仍可独立运行，随时对比。

         【本目录自己新写的】数据层 5 个（4 个生成物 + 1 个手抄）+ 视图层 3 个：
           scripts/data/pump-ledger.js      台账 40 台        ← tools/build_data.py 生成
           scripts/data/pump-faults.js      故障 118 条       ← tools/build_data.py 生成
           scripts/data/pump-unit-model.js  IMS 6 子系统 48 部件 ← tools/build_data.py 生成
           scripts/data/pump-state.js       ISO 分级 / 25 测点 / 当月故障 ← 手抄两份 docx
           scripts/data/sites.js            7 站库投影，喂 3D（替换旧目录的 44 节点）
           scripts/core/chartopts.js / scripts/scenes/overview.js / scripts/boot.js
         =================================================================== -->

    <!-- L0 vendor -->
    <script src="../hunan-pump-overview/vendor/three.min.js"></script>
    <script src="../hunan-pump-overview/vendor/echarts.min.js"></script>

    <!-- L1 契约（零依赖，必须最先加载；ui/cards.js 在 IIFE 顶部就读
         HunanContract.STATUSES，顺序不能倒） -->
    <script src="../hunan-pump-overview/scripts/map3d/contract.js"></script>

    <!-- L2 数据。geo/topology 复用旧目录；泵的五个文件是本目录的。
         顺序有依赖：sites.js 在 stationStatus() 里读 PumpLedger 和 PumpState，
         必须排在这两个之后。 -->
    <script src="../hunan-pump-overview/scripts/data/geo.js"></script>
    <script src="../hunan-pump-overview/scripts/data/topology.js"></script>
    <script src="scripts/data/pump-ledger.js"></script>
    <script src="scripts/data/pump-faults.js"></script>
    <script src="scripts/data/pump-unit-model.js"></script>
    <script src="scripts/data/pump-state.js"></script>
    <script src="scripts/data/sites.js"></script>

    <!-- L3 3D model + engine。model-map.js 是**本目录的副本**（与旧目录只差挤出块的
         色板：旧版用源表给白底 Excel 图例的粉彩色，黑底上相邻色块糊成一片；本版按
         在役机组台数分四档青蓝，详见该文件头）。它读 window.PumpLedger，所以必须排在
         L2 数据之后。model-sites / model-pipelines / engine 仍引用旧目录原文件。
         model-map -> model-sites -> model-pipelines 的顺序不能变：
         model-pipelines.js 末尾装配 window.HunanMapModel 时依赖前两个已经把
         window.HunanModelMap / window.HunanModelSites 挂好） -->
    <script src="scripts/map3d/model-map.js"></script>
    <script src="../hunan-pump-overview/scripts/map3d/model-sites.js"></script>
    <script src="../hunan-pump-overview/scripts/map3d/model-pipelines.js"></script>
    <script src="../hunan-pump-overview/scripts/map3d/engine.js"></script>

    <!-- L4 core：前四个复用旧目录，chartopts.js 是本目录新写的 -->
    <script src="../hunan-pump-overview/scripts/core/screen-scale.js"></script>
    <script src="../hunan-pump-overview/scripts/core/dom.js"></script>
    <script src="../hunan-pump-overview/scripts/core/charts.js"></script>
    <script src="../hunan-pump-overview/scripts/core/timers.js"></script>
    <script src="scripts/core/chartopts.js"></script>

    <!-- L5 ui：只用 cards.js（指标卡 / 图表卡）。selectlist / detailcard / overlay
         在本 POC 里没有渲染路径，不加载。 -->
    <script src="../hunan-pump-overview/scripts/ui/cards.js"></script>

    <!-- L6 场景 -->
    <script src="scripts/scenes/overview.js"></script>

    <!-- L7 引导 -->
    <script src="scripts/boot.js"></script>
  </body>
</html>

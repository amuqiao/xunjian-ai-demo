<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泵站演示大屏</title>
    <link rel="stylesheet" href="flow-nav/flow-nav.css">
    <style>
      :root {
        /* 与 flow-nav.css 的 --nav-h 必须一致：一个定条高、一个定舞台起点。 */
        --nav-h: 44px;
        --beng-screen-bg: #06111f;
        --beng-boot-bg:
          radial-gradient(circle at 38% 35%, rgba(56, 198, 236, 0.18), transparent 34%),
          radial-gradient(circle at 62% 64%, rgba(47, 140, 255, 0.14), transparent 38%),
          #06111f;
        --beng-boot-text: rgba(232, 244, 255, 0.88);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--beng-screen-bg);
      }

      /* 【为什么是 top: var(--nav-h) 而不是 inset: 0】切换条从左下角悬浮改成了顶部固定条
         （见 flow-nav/flow-nav.css 的说明）。舞台整体下移，组件的坐标系跟着下移 ——
         这样组件永远不会被导航叠住，也就不需要为外壳预留安全区。
         44px 这个高度对固定画布的那几个屏**零代价**：2471×1289 的宽高比 1.92 比常见屏幕更宽，
         它们全是宽度受限，砍掉的只是上下留白，scale 一点没变（实测 0.6799 → 0.6799）。 */
      .demo-frame-stage {
        position: fixed;
        top: var(--nav-h, 44px);
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--beng-screen-bg);
      }

      .demo-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        background: var(--beng-screen-bg);
      }

      .demo-frame.is-active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .demo-boot {
        position: fixed;
        top: var(--nav-h, 44px);
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        place-items: center;
        color: var(--beng-boot-text);
        font: 600 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        letter-spacing: 0.12em;
        background: var(--beng-boot-bg);
        transition: opacity 0.24s ease, visibility 0.24s ease;
        pointer-events: none;
      }

      .demo-boot.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <main class="demo-frame-stage" id="frameStage" aria-label="泵站演示组件容器"></main>
    <div class="demo-boot" id="bootMask">泵站演示加载中</div>

    <script src="flow-nav/flow-nav.js"></script>
    <script>
      (function () {
        "use strict";

        // 组件清单只在 flow-nav/flow-nav.js 里维护一份。这里不留兜底：拿不到就直接炸，
        // 换目录时才不会出现"导航切到 v2、iframe 还指着旧目录"这种一半生效的状态。
        if (!window.BengFlowSteps) {
          throw new Error("[beng-demo] flow-nav/flow-nav.js 未先加载，取不到组件清单");
        }
        var steps = window.BengFlowSteps;

        var stage = document.getElementById("frameStage");
        var bootMask = document.getElementById("bootMask");
        var frames = {};
        var activeKey = "agent";

        function stepByKey(key) {
          for (var i = 0; i < steps.length; i += 1) {
            if (steps[i].key === key) return steps[i];
          }
          throw new Error("[beng-demo] 未知组件：" + key);
        }

        function hasStep(key) {
          return steps.some(function (step) { return step.key === key; });
        }

        function frameKeyBySource(source) {
          var keys = Object.keys(frames);
          for (var i = 0; i < keys.length; i += 1) {
            if (frames[keys[i]].contentWindow === source) return keys[i];
          }
          return "";
        }

        function validateSwitchRequest(data, source) {
          if (!hasStep(data.key)) {
            throw new Error("[beng-demo] iframe 请求切到未知组件：" + data.key);
          }
          var sourceKey = frameKeyBySource(source);
          if (!sourceKey) {
            throw new Error("[beng-demo] 拒绝未知来源的切屏消息：" + data.key);
          }
          if (sourceKey !== activeKey) {
            throw new Error("[beng-demo] 拒绝后台组件切屏：" + sourceKey + " -> " + data.key);
          }
        }

        function createFrame(step) {
          var frame = document.createElement("iframe");
          frame.className = "demo-frame";
          frame.title = step.label;
          frame.dataset.key = step.key;
          frame.dataset.loaded = "0";
          frame.setAttribute("loading", step.key === activeKey ? "eager" : "lazy");
          frame.addEventListener("load", function () {
            frame.dataset.loaded = "1";
            postVisibility(step.key);
            if (step.key === activeKey) {
              bootMask.classList.add("is-hidden");
            }
          });
          frame.src = step.href;
          stage.appendChild(frame);
          frames[step.key] = frame;
          return frame;
        }

        function ensureFrame(key) {
          return frames[key] || createFrame(stepByKey(key));
        }

        function postVisibility(key) {
          var frame = frames[key];
          if (!frame || !frame.contentWindow) return;
          frame.contentWindow.postMessage({
            type: "beng-demo:visibility",
            key: key,
            active: key === activeKey
          }, "*");
        }

        function syncFrameVisibility() {
          Object.keys(frames).forEach(postVisibility);
        }

        function navKeyFor(key) {
          return stepByKey(key).parentKey || key;
        }

        function setNavActive(key) {
          var activeNavKey = navKeyFor(key);
          document.querySelectorAll(".inspection-flow-nav a").forEach(function (link) {
            link.classList.toggle("is-active", link.dataset.key === activeNavKey);
          });
        }

        function activate(key) {
          var frame = ensureFrame(key);
          if (key === activeKey && frame.classList.contains("is-active")) return;

          activeKey = key;
          Object.keys(frames).forEach(function (frameKey) {
            frames[frameKey].classList.toggle("is-active", frameKey === key);
          });
          syncFrameVisibility();
          setNavActive(key);
          if (frame.dataset.loaded !== "1") bootMask.classList.remove("is-hidden");
          else bootMask.classList.add("is-hidden");
        }

        window.BengDemoShell = {
          steps: steps,
          currentKey: function () { return activeKey; },
          switchTo: activate
        };
        window.BengDemoShellDebug = {
          validateSwitchRequest: validateSwitchRequest
        };

        window.addEventListener("message", function (event) {
          var data = event.data;
          if (!data || data.type !== "beng-demo:switch") return;
          validateSwitchRequest(data, event.source);
          activate(data.key);
        });

        ensureFrame("agent").classList.add("is-active");
        syncFrameVisibility();
      })();
    </script>
  </body>
</html>

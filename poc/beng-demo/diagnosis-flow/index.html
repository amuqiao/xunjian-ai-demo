<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>诊断工作台 → 知识库 · 演示骨架</title>

    <link rel="stylesheet" href="styles/01-tokens.css" />
    <link rel="stylesheet" href="styles/02-shell.css" />
    <link rel="stylesheet" href="styles/03-cards.css" />
    <link rel="stylesheet" href="styles/04-charts.css" />
    <link rel="stylesheet" href="styles/05-workbench.css" />
    <link rel="stylesheet" href="styles/06-detail.css" />
    <link rel="stylesheet" href="styles/07-review.css" />
    <link rel="stylesheet" href="styles/08-archive.css" />
    <link rel="stylesheet" href="styles/09-knowledge.css" />
    <link rel="stylesheet" href="styles/10-overlay.css" />
    <link rel="stylesheet" href="styles/11-responsive.css" />
    <link rel="stylesheet" href="../flow-nav/flow-nav.css" />

  </head>
  <body>
    <div class="app-shell">
      <header class="topbar panel">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">D</div>
          <div>
            <h1 id="brandTitle">诊断流程</h1>
            <small id="brandSub"></small>
          </div>
        </div>

        <nav id="sceneNav" class="scene-nav" aria-label="演示场景"></nav>

        <div class="top-status">
          <div id="clock"></div>
          <div id="statusLine"></div>
          <button class="tool-btn" type="button" data-action="reset-demo">重置演示</button>
        </div>
      </header>

      <main class="stage" id="stage" tabindex="-1"></main>
    </div>

    <!-- 浮层挂在 app-shell 之外，避免被场景容器的 overflow 裁掉 -->
    <div id="overlayRoot"></div>

    <!-- L0 vendor（本 POC 不含 3D，不引入 three.js） -->
    <script src="vendor/echarts.min.js"></script>

    <!-- L1 领域包：换课题只换这一组 script -->
    <script src="domain-skeleton/00-meta.js"></script>
    <script src="domain-skeleton/01-taxonomy.js"></script>
    <script src="domain-skeleton/02-records.js"></script>
    <script src="domain-skeleton/03-series.js"></script>
    <script src="domain-skeleton/04-vision.js"></script>
    <script src="domain-skeleton/05-diagnosis.js"></script>
    <script src="domain-skeleton/06-review.js"></script>
    <script src="domain-skeleton/07-report.js"></script>
    <script src="domain-skeleton/08-agentqa.js"></script>
    <script src="domain-skeleton/09-kb.js"></script>
    <script src="scripts/schema.js"></script>

    <!-- L2 core -->
    <script src="scripts/core/dom.js"></script>
    <script src="scripts/core/state.js"></script>
    <script src="scripts/core/report.js"></script>
    <script src="scripts/core/charts.js"></script>
    <script src="scripts/core/chartopts.js"></script>
    <script src="scripts/core/timers.js"></script>

    <!-- L3 ui 组件 -->
    <script src="scripts/ui/cards.js"></script>
    <script src="scripts/ui/selectlist.js"></script>
    <script src="scripts/ui/overlay.js"></script>
    <script src="scripts/ui/confidencebar.js"></script>
    <script src="scripts/ui/evidencechain.js"></script>
    <script src="scripts/ui/reviewform.js"></script>
    <script src="scripts/ui/agentpanel.js"></script>

    <!-- L4 场景 -->
    <script src="scripts/scenes/workbench.js"></script>
    <script src="scripts/scenes/detailscreen.js"></script>
    <script src="scripts/scenes/review.js"></script>
    <script src="scripts/scenes/archive.js"></script>
    <script src="scripts/scenes/knowledge.js"></script>

    <!-- L5 引导。devpresets 只在 URL 带 #preset= 时起作用，正常演示下是空操作。 -->
    <script src="scripts/devpresets.js"></script>
    <script src="scripts/boot.js"></script>
    <script src="../flow-nav/flow-nav.js"></script>
  </body>
</html>
